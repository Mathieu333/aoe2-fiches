<title>Fiches de matchup AoE2</title>
<style>
  :root { --bg: #10151d; --panel: #18202c; --ink: #e8edf3; --mut: #9aa6b4; --line: #2a3443;
    --f: #d99a2b; --c: #4a95e6; --i: #a070e6; --warn-bg: #3a2c10; --warn-ink: #f0c060; --acc: #4a95e6; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6f9; --panel: #fff; --ink: #17202c; --mut: #5f6b7a;
    --line: #dde2e8; --warn-bg: #fff4dc; --warn-ink: #8a5300; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 40px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 18px; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  label { font-size: 13px; color: var(--mut); display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  .draft { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 2px 8px; }
  .ttl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .ttl b { font-size: 22px; }
  .gp { font-size: 17px; font-weight: 600; margin: 10px 0 2px; }
  .their { color: var(--mut); margin: 8px 0 18px; } .their b { color: var(--ink); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .a2 { --age: var(--f); } .a3 { --age: var(--c); } .a4 { --age: var(--i); }
  .age-hd { border-top: 5px solid var(--age); padding-top: 8px; }
  .an { font-weight: 800; letter-spacing: .06em; color: var(--age); font-size: 13px; }
  .goal { font-weight: 600; margin-top: 2px; }
  h4 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--mut); }
  ul { margin: 0; padding-left: 18px; } li { margin: 4px 0; }
  .si { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--age); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .si .tr { font-weight: 700; } .si .tr::before { content: "SI "; color: var(--age); }
  .att { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  details { margin-top: 2px; } summary { cursor: pointer; color: var(--mut); font-size: 12.5px; list-style: none; }
  summary::-webkit-details-marker { display: none; } summary::before { content: "▸ " attr(data-l); } details[open] > summary::before { content: "▾ " attr(data-l); }
  details.more { margin-top: 14px; } details.more > summary { font-size: 14px; color: var(--acc); }
  details.w { display: inline; margin-left: 4px; } details.w[open] { display: block; }
  details.w > summary { display: inline-block; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line); text-align: center; line-height: 15px; font-size: 11px; vertical-align: 1px; }
  details.w > summary::before, details.w[open] > summary::before { content: "?"; }
  .why { color: var(--mut); font-size: 13.5px; }
  .att .why { color: inherit; opacity: .8; }
  .empty { padding: 40px 0; color: var(--mut); font-size: 16px; }
  footer { margin-top: 28px; color: var(--mut); font-size: 12.5px; }
  .live { background: #3a1416; border: 1px solid #a3343a; color: #ffd9db; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 16px; }
  .live a { color: #fff; } h4 a { color: var(--acc); text-decoration: none; }
  nav { display: flex; gap: 4px; } nav button.on { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .ctl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; } [hidden] { display: none !important; }
  .note { color: var(--mut); font-size: 13.5px; margin: 6px 0 14px; max-width: 900px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mut); font-weight: 600; font-size: 12.5px; } td a { color: var(--acc); text-decoration: none; }
  .st ul { padding-left: 0; } .st li { list-style: none; margin: 5px 0; }
  .wr { font-variant-numeric: tabular-nums; white-space: nowrap; } .up { color: #3fb27f; } .dn { color: #e0605a; }
  .lead { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; } .hero b { font-size: 24px; }
  .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; } .mut { color: var(--mut); font-size: 13px; }
  .good { color: #3fb27f; } .bad { color: #e0605a; } .flat { color: var(--ink); }
  .bars { display: grid; gap: 7px; margin-top: 8px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(40px, 1fr) 3em; align-items: center; gap: 8px; font-size: 14px; }
  table.civs { max-width: 560px; }
  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin: 6px 0 12px; }
  .chip b { font-size: 14px; } .chips .chip { font-size: 13.5px; padding: 4px 11px; cursor: help; }
  @media (max-width: 1000px) { .tiles { grid-template-columns: 1fr 1fr; } } @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .opt { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 15px; } .opt span { white-space: nowrap; font-weight: 700; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--age); border-radius: 8px; padding: 10px 14px; }
  .tile .an { font-size: 12px; }
  .opt [title] { cursor: help; } .tv { font-size: 22px; font-weight: 800; margin: 2px 0; }
  .gl { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; } .fill { height: 100%; background: var(--age, var(--acc)); }
  .bar .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .legend { font-size: 12px; color: var(--mut); margin-top: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .games { display: grid; gap: 10px; } .game { display: block; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid #e0605a; border-radius: 8px; padding: 10px 14px; color: var(--ink); text-decoration: none; }
  .game.w { border-left-color: #3fb27f; } .game:hover { border-color: var(--acc); } .gh { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; } .gh b { font-size: 17px; }
  .flags { list-style: none; padding: 0; margin: 6px 0 0; } .flags li { margin: 3px 0; }
  .flags.big li { font-size: 16px; margin: 6px 0; }
  .fbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; } .sep { width: 10px; }
  .fchip { font-size: 13px; padding: 4px 11px; border-radius: 14px; } .fchip.on { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .badges { margin-left: auto; font-size: 16px; letter-spacing: 3px; }
  .mswitch { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 16px 0 6px; } .mswitch .mut { margin-left: 6px; }
  .chart { position: relative; height: 150px; border-bottom: 1px solid var(--line); }
  .half { position: absolute; left: 0; right: 0; height: 50%; } .half.top { top: 0; } .half.bot { bottom: 0; }
  .half i { position: absolute; cursor: pointer; } .half.top i { bottom: 0; border-radius: 2px 2px 0 0; } .half.bot i { top: 0; border-radius: 0 0 2px 2px; opacity: .85; }
  .half i:hover { outline: 2px solid var(--ink); }
  .agel { position: absolute; top: 0; bottom: 0; border-left: 2px dashed; opacity: .6; pointer-events: auto; cursor: help; }
  .axis { position: relative; height: 18px; font-size: 11px; color: var(--mut); } .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .axis span:first-child { transform: none; }
  .chrono { display: grid; grid-template-columns: 70px 1fr; row-gap: 2px; align-items: center; }
  .chrono .fam { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); margin-top: 8px; }
  .chrono .lab { font-size: 12px; font-weight: 600; } .lane { position: relative; height: 26px; border-bottom: 1px dotted var(--line); }
  .ev { position: absolute; bottom: 3px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: var(--c); cursor: pointer; }
  .ev b { position: absolute; left: 50%; transform: translate(-50%, -100%); font-size: 10px; font-weight: 600; white-space: nowrap; color: var(--ink); opacity: .85; }
  .ev:hover { outline: 2px solid var(--ink); z-index: 2; }
  .mapctl { display: flex; gap: 10px; align-items: center; } .mapctl input[type=range] { flex: 1; } .mapctl b { font-variant-numeric: tabular-nums; min-width: 48px; }
  #map { width: 100%; max-width: 900px; display: block; margin: 8px auto; } .ground { fill: #c9b27c33; stroke: var(--line); }
  .chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; color: var(--mut); }
</style>

  const CARDS = [{"key":"chinese::chinese","version":"chinese-chinese-v1","status":"draft","createdAt":"2026-11-07","dataVersion":"4108e1a13d36","card":{"mine":"Chinese","theirs":"Chinese","gamePlan":{"action":"Scouts → lire son ouverture à l'arrivée en Féodal → réponse minimale → Crossbow + Bodkin avant lui → 3 TC derrière arbalètes + Rocket Carts → Imp : Arbalètes + Bracer, Heavy Rocket Carts et Siege Rams qu'il ne peut pas arrêter à distance.","why":"En miroir, éco et arbre sont identiques : l'avantage vient de l'information (voir son ouverture tôt), du premier spike d'upgrades archer (AF4 : le premier à Crossbow + Bodkin gagne le combat d'archers) et d'un siège que les Chinese ne savent pas contrer de loin : ni Bombard Cannon, ni Redemption dans l'arbre (S43). Replays 1900+ Arabia : scouts = ouverture chinoise la plus jouée (33 %, 67 % de victoires, à confirmer) ; en fin de Castle, le Rocket Cart est l'unité la plus jouée.","sources":["manual","S11","S43","S87","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":101,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3},{"civ":"Chinese","kind":"Unit","id":1904,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Unit","id":1907,"age":4},{"civ":"Chinese","kind":"Unit","id":548,"age":4}]},"theirPlan":{"action":"Même civ : 1 joueur Chinese 1900+ sur 3 ouvre scouts, 1 sur 3 archers, puis Crossbow + Bodkin et Rocket Carts ou knights en Castle. Il n'a ni BBC, ni Redemption, ni Hussar, ni Paladin.","why":"Replays 1900+ Arabia (185 parties Chinese) : scouts 33 %, archers 31 %, M@A 12 %, tirailleurs 11 % ; début Castle arbalètes 47 % des joueurs, knights 32 % ; fin Castle Rocket Carts 37 %. L'arbre Chinese n'a pas Bombard Cannon, Redemption, Hussar, Paladin ni Mangonel (le Rocket Cart le remplace).","sources":["S87","S89","tree:Chinese","data"],"assets":[]},"phases":[{"age":2,"goal":"Voir son ouverture avant 10:00 et y répondre avec le minimum d'unités, pour cliquer Castle avec autant de vils que lui et l'or prêt pour Crossbow + Bodkin.","do":[{"action":"Ouvre scouts : 3 scouts à l'arrivée en Féodal. Au clic Féodal, 6 vils au bois si tu restes scouts, 8 si tu passes archers.","why":"Ouverture chinoise la plus jouée à 1900+ (33 %, 67 % de victoires, marge ±12). SF4 : le nombre de vils au bois se décide au clic.","sources":["S37","S87","S89"],"assets":[{"civ":"Chinese","kind":"Building","id":101,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"action":"Ton premier scout part dans sa base dès l'arrivée : compte écuries, ranges, casernes. Choisis ta suite avant 10:00.","why":"En miroir, la seule différence possible au départ est l'information. Chaque transition = le contre minimal à ce qu'il a engagé (TEMPO2).","sources":["S71","manual"],"assets":[]},{"action":"Palissade sur ton bois et ton or avant 12:00.","why":"Ses scouts ou ses archers visent tes vils exposés ; un mur fini garde ton éco égale à la sienne pendant que tu lis son plan.","sources":["manual","S14"],"assets":[{"civ":"Chinese","kind":"Building","id":72,"age":1},{"civ":"Chinese","kind":"Building","id":792,"age":1}]},{"action":"Dès 13:00, 3 vils de plus à l'or : au clic Castle, garde l'or pour Crossbow + Bodkin dès l'arrivée.","why":"AF4 : le premier à Crossbow + Bodkin gagne le combat d'archers. Les deux joueurs ont la même réduction de techs ; seul l'ordre de tes dépenses fait la différence.","sources":["S11","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":584,"age":1}]}],"ifSee":[{"trigger":"2 ranges : il ouvre archers","action":"Pas de scouts dans sa boule : 1 range, 6 tirailleurs + Fletching devant chez toi, tes scouts sur ses bûcherons et son or. Ensuite tes archers derrière tes tirailleurs.","why":"Les scouts perdent contre une masse d'archers mais tuent ses vils isolés ; les tirailleurs sont la réponse la moins chère à ses archers (TEMPO2). 65 % des Chinese 1900+ ont des archers en fin de Féodal.","sources":["S71","S89"],"assets":[{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":7,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"une écurie et ses scouts : scout mirror","action":"3-4 lanciers sous ton TC, tes scouts ne se battent que près de tes lanciers ; passe archers derrière (8 vils au bois).","why":"Même éco des deux côtés : personne n'est forcé de dévier (SF5) ; c'est le premier à ajouter les lanciers et à garder ses vils en vie qui gagne le mirror (OPEN2).","sources":["S37","S72"],"assets":[{"civ":"Chinese","kind":"Building","id":12,"age":1},{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]},{"trigger":"des milices avant son Féodal (M@A)","action":"Ferme le mur sur ton or, 3-4 archers derrière ; tes scouts évitent ses M@A et vont sur ses bûcherons.","why":"Ses M@A ne passent pas un mur gardé par des archers ; tes scouts font des dégâts ailleurs pendant qu'il a investi dans la caserne.","sources":["manual","S87"],"assets":[{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"aucune unité à 10:00 : il fast Castle","action":"Tes scouts sur ses vils de bois et d'or dès maintenant, puis 1 range d'archers ; il doit dépenser avant son Castle.","why":"Un FC chinois sans armée (5 % des Chinese 1900+) laisse ses vils seuls pendant 3-4 minutes ; chaque vil tué retarde son boom.","sources":["S87","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2},{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]}],"watch":[{"action":"Ne lance jamais tes scouts dans ses lanciers ou dans ses arche ,"assets":[{"civ":"Chinese","kind":"Building","id":101,"age":2},{"civ":"Chinese","kind":"Unit","id":38,"age":3}]}],"ifSee":[{"trigger":"ses Rocket Carts","action":"Tes knights les chassent par le côté ; tes arbalètes reculent hors de leur portée (7) et ne restent jamais en tas.","why":"Rocket Carts lents (0,6) et fragiles (45 PV) : la cavalerie les rejoint avant qu'ils tirent plusieurs fois.","sources":["data","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3}]},{"trigger":"ses knights","action":"Piquiers devant tes arbalètes, Rocket Carts derrière ; combats près de tes TC.","why":"Les knights battent les arbalètes au contact ; les piquiers les arrêtent devant ta boule.","sources":["manual","S56"],"assets":[{"civ":"Chinese","kind":"Building","id":12,"age":1},{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":1904,"age":3}]},{"trigger":"une masse de tirailleurs","action":"Knights sur ses tirailleurs, Rocket Carts dessus ; tes arbalètes ne tirent pas sur ses tirailleurs.","why":"Les tirailleurs battent les arbalètes mais pas la cavalerie ; ne pas jouer la guerre de tirailleurs (SF7).","sources":["S69","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3},{"civ":"Chinese","kind":"Unit","id":1904,"age":3}]},{"trigger":"il boome à 3 TC sans armée","action":"6-8 knights + tes arbalètes sur ses bûcherons et ses mineurs avant qu'il ait Crossbow + Bodkin.","why":"Une fenêtre où tu as l'armée et lui l'éco : chaque vil tué compte double en miroir.","sources":["S73","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]}],"watch":[{"action":"Pas de 3 TC + push + château en même temps.","why":"L'hybride perd tout (MIX1) : un seul plan au clic Castle.","sources":["S73"],"assets":[]},{"action":"Ses moines ne peuvent pas convertir ton siège : il n'a pas Redemption.","why":"Ton Rocket Cart et tes rams restent sûrs face aux moines ; contre tes unités, s au chez toi → Imp : Arbalest + Bracer + Halbs + Heavy Scorpions (Rocketry), là où il n'a ni Arbalest, ni Bracer, ni BBC.","why":"Les Cumans doivent gagner en Castle (S47 : Paladin + Kipchak ne suffisent pas en late contre une civ archer complète). Ton arbre chinois finit Arbalest + Bracer, le sien s'arrête au Crossbow ; sans BBC, il n'a rien contre des scorpions protégés (LATE1). Replays 1900+ Arabia : Chinese 58 % (n=185), Cumans 42 % (n=130), face-à-face Chinese 4 sur 4.","sources":["manual","S47","S43","S80","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Building","id":621,"age":3},{"civ":"Chinese","kind":"Building","id":82,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Unit","id":359,"age":4},{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4}]},"theirPlan":{"action":"2e TC dès le Féodal (près de la moitié des Cumans 1900+) ou bélier de Féodal → knights en Castle, parfois Steppe Lancers ou cav. archers, béliers et mangonneaux → Paladin + Kipchak + Hussar. Il doit te casser avant ton Imp.","why":"Bonus Cumans : un TC de plus en Féodal, atelier de siège et Battering Ram en Féodal, Capped Ram en Castle, montés +5/10/15 %, range et écurie -75 bois. Replays 1900+ : 58 Cumans sur 130 posent un TC en Féodal (médiane 9:29) ; en Castle, knights chez 35-45 % des joueurs ; Steppe Lancers ≥ 20 % de l'armée : 68 % de victoires (n=19, piste).","sources":["tree:Cumans","manual","S47","S80","S89"],"assets":[{"civ":"Cumans","kind":"Building","id":621,"age":2},{"civ":"Cumans","kind":"Unit","id":1258,"age":2},{"civ":"Cumans","kind":"Unit","id":38,"age":3},{"civ":"Cumans","kind":"Unit","id":1370,"age":3},{"civ":"Cumans","kind":"Unit","id":39,"age" er qui survit compte.","sources":["S89","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2}]}],"ifSee":[{"trigger":"un bélier (atelier de siège dès son Féodal) qui avance vers ton TC","action":"8-10 vils + tes lanciers frappent le bélier ; tes scouts tuent son escorte. Pas d'archers dessus.","why":"Le Battering Ram a 180 d'armure perce et -3 d'armure mêlée : flèches inutiles, vils et lanciers le cassent.","sources":["tree:Cumans","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"une masse de scouts (ses écuries coûtent 75 bois de moins)","action":"3-4 lanciers sous ton TC, mur complet sans trou ; tes scouts rentrent avec les lanciers, archers derrière le mur.","why":"Il en produit plus que toi et plus vite : tes scouts seuls perdent. Les lanciers + le TC gagnent le combat chez toi (AF6).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":72,"age":1},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]},{"trigger":"ses archers","action":"Range jamais idle, Fletching tout de suite ; tes scouts chassent ses archers isolés. Au clic Castle : Crossbow + Bodkin en premier.","why":"Le premier au Crossbow + Bodkin gagne la guerre d'archers (AF4) ; tes techs coûtent -10 % en Castle.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3}]},{"trigger":"ses tirailleurs devant tes archers","action":"Tes scouts sur ses tirailleurs, tes archers derrière le mur. Pas de tirailleurs contre tirailleurs.","why":"Ses tirailleurs ne cassent pas tes murs ; tes scouts les tuent et tes archers restent en vie pour Castle (SF7, TR3).","sources":["manual","S69"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2}]}],"watch":[{"action":"Tes scouts n'entrent pas sous son TC garni : 5 vils dedans tuent un scout en quelques tirs.","why":"Le but est de lui coûter des vils et du temps, pas d'échanger tes scouts contre rien.","sources":["manual"],"assets":[]},{"action":"Pas de 2e TC chinois en Féodal : ton boom vient en Castle, derrière ton armée.","why":"Tu n'as pas son bonus ; un TC de Féodal sans armée devant est la cible de ses scouts plus rapides.","sources":["tree:Chinese","tree:Cumans"],"assets":[]}]},{"age":3,"goal":"Tenir sa poussée de Castle (knights, Steppe Lancers, béliers) sans perdre de TC, et boomer à 3 TC. S'il ne te casse pas en Castle, il a perdu le late.","do":[{"action":"Crossbow + Bodkin + Thumb Ring ; 10-15 arbalètes avec 6-8 piquiers devant.","why":"Début Castle des Chinese 1900+ : arbalètes chez 47 % des joueurs (69 % de victoires). Sa compo n°1 est le knight : les piquiers le tiennent, les arbalètes tirent derrière (B2).","sources":["manual","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3},{"civ":"Chinese","kind":"Tech","id":437,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]},{"action":"Pose 2 TC en Castle (3 au total), le 3e une fois tes piquiers sortis.","why":"Chinese 1900+ avec 2 TC posés en Castle : 72 % de victoires (n=68). Chaque TC donne aussi +15 de population.","sources":["S80","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":621,"age":3}]},{"action":"Château dans ta base, au-dessus des fermes. Pierre : 850 (2 TC + château).","why":"Il n'a ni BBC ni trébuchet avant l'Imp : un château chez toi tient ses knights et ses béliers (CA9b).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":82,"age":3}]},{"action":"Écurie : 3 knights qui ne servent qu'à tuer ses béliers et ses mangonneaux.","why":"Les flèches ne font rien aux béliers ; les knights tuent le siège et reviennent sous tes arbalètes.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3}]},{"action":"Monastère : 3-4 moines derrière la boule pour soigner et convertir ses knights.","why":"Contre une civ knights, les moines comptent dans le combat (ATK1).","sources":["manual","S41","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":104,"age":3},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]}],"ifSee":[{"trigger":"une masse de knights","action":"8-10 piquiers devant, arbalètes derrière, combat sous tes TC et ton château. Jamais tes arbalètes seules en terrain ouvert.","why":"Ses knights sont 10 % plus rapides que tes renforts : il gagne seulement si tu te bats loin de chez toi.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Steppe Lancers","action":"Même réponse, avec plus de piquiers ; une fois bloqués, tes arbalètes les fondent (60 PV, 1 d'armure perce).","why":"Le Steppe Lancer est sa meilleure piste en Castle chez les 1900+ (68 % quand ≥ 20 % de l'armée, n=19).","sources":["tree:Cumans","S80","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Kipchaks ou des cav. archers","action":"Elite Skirmisher : 8-10 tirailleurs avec tes arbalètes, sous tes TC.","why":"Les tirailleurs ne coûtent pas d'or et tiennent ses archers montés ; tes arbalètes restent pour ses knights.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3}]},{"trigger":"des béliers (Capped Ram dès son Castle) et des mangonneaux","action":"Tes 3 knights sur ses mangonneaux, tes piquiers et des vils sur les béliers ; arbalètes écartées en ligne.","why":"Ses mangonneaux tuent une boule d'arbalètes groupée ; ses béliers ne craignent que la mêlée.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]}],"watch":[{"action":"Pas de push forward en Castle : tu gagnes en attendant.","why":"En terrain ouvert ses montés plus rapides contournent tes piquiers ; chez toi, TC + château + piquiers les arrêtent.","sources":["manual","S47"],"assets":[]},{"action":"Garde 4-5 piquiers près de tes fermes : il a la cav la plus rapide de la partie.","why":"Montés Cumans +10 % en Castle : un raid sur fermes nues coûte plus que la bataille.","sources":["tree:Cumans"],"assets":[]}]},{"age":4,"goal":"Passer Imp sans perdre de TC, puis prendre la carte : Arbalest + Bracer et scorpions contre une civ sans Arbalest, sans Bracer, sans BBC.","do":[{"action":"Arbalester + Bracer dès le clic, puis Chemistry.","why":"Ses archers à pied s'arrêtent au Crossbow sans Bracer : ton tir à distance devient nettement meilleur (techs -15 % en Imp).","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Tech","id":47,"age":4}]},{"action":"Halberdier : 10-15 hallebardiers devant la boule.","why":"Paladin, Hussar et Steppe Lancer : toute sa fin de partie est montée.","sources":["tree:Cumans","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"action":"Heavy Scorpion + Rocketry + Ballistics : 6-10 scorpions derrière les halbs.","why":"Contre une civ sans BBC, des scorpions protégés sont un plan (LATE1) ; Rocketry leur donne +25 % d'attaque.","sources":["manual","S43","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4},{"civ":"Chinese","kind":"Tech","id":93,"age":3},{"civ":"Chinese","kind":"Building","id":49,"age":3}]},{"action":"2-3 trébuchets dans l'armée pour ses châteaux.","why":"Sans BBC, il ne peut tuer tes trébuchets qu'en chargeant à travers tes halbs.","sources   const leadText = l => esc(l[0].replace(/ ≥ 20 % en Castle$/, ' en Castle').replace(/^ouverture /, 'Ouverture ')

  // Une tuile par phase : les 3 choix les plus joués, % des joueurs · % de victoires.

  const tile = (age, title, rows, total, castle) => '<div class="tile a' + age + '"><div class="an">' + title + '</div>'

  const PH = { feudal_late: [2, 'FIN FÉODAL'], castle_early: [3, 'DÉBUT CASTLE'], castle_late: [3, 'FIN CASTLE'], imp_early: [4, 'DÉBUT IMP'], imp_late: [4, 'FIN IMP'] };
  const phaseTiles = d => '<div class="tiles">' + tile(2, 'DÉBUT FÉODAL', d.openings, d.all[1], false)

    const p = (y[0] + n[0]) / (y[1] + n[1]), se = Math.sqrt(p * (1 - p) * (1 / y[1] + 1 / n[1])), z = se ? (y[0] / y[1] - n[0] / n[1]) / se : 0;

  // Matchup sans fiche rédigée : ce que font les joueurs 1900+ de chaque civ (replays), et le face-à-face.

  // Mes parties (S98-S99) : les revues de review.py. Liste filtrable par badges ; page d'une partie =

  let metric = 'orders', mapT = 0, playing = null;
  function chart(g) {
    const [a, b] = metric === 'orders' ? g.orders : g.series[metric], n = a.length, max = Math.max(1, ...a, ...b), total = n * 60000;
    const col = (v, i, up) => '<i class="' + (up ? 'up' : 'dn') + '" style="left:' + (i / n * 100) + '%;width:calc(' + (100 / n) + '% - 2px);height:' + (v / max * 100) + '%;background:' + (up ? ME_C : HIM_C) + '" title="' + i + '-' + (i + 1) + ' min : ' + v + (up ? ' (toi)' : ' (lui)') + '" data-m="' + i + '"></i>';

  // Chronologie : une ligne par famille et par joueur, un point par upgrade (nom court au-dessus).
  const TSHORT = { 22: 'Loom', 213: 'Brouette', 249: 'Hand Cart', 202: 'Double-Bit', 203: 'Bow Saw', 221: 'Two-Man', 14: 'Horse Collar', 13: 'Heavy Plow', 12: 'Crop Rot.',

  // Carte : bâtiments posés (pas leur destruction : le replay ne la dit pas), murs, et les clics

  function mapView(g) {
    const N = g.mapSize, k = 720 / (2 * N), P = (x, y) => [(x - y) * k + 360, (x + y) * k / 2];
    const corner = [P(0, 0), P(N, 0), P(N, N), P(0, N)].map(p => p.join(',')).join(' ');

  }
  function drawMap(g) {
    const N = g.mapSize, k = 720 / (2 * N), P = (x, y) => [(x - y) * k + 360, (x + y) * k / 2], t = mapT, C = s => s ? HIM_C : ME_C;
    const name = id => g.buildingNames[id] || '';
    let h = g.map.walls.filter(w => w[0] <= t).map(w => { const [a, b] = [P(w[2], w[3]), P(w[4], w[5])];
      return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="' + C(w[1]) + '" stroke-width="2.5" stroke-linecap="round"/>'; }).join('');
    h += g.map.builds.filter(b => b[0] <= t).map(b => { const [x, y] = P(b[3], b[4]), n = name(b[2]), ic = ICON[n];
      const big = n === 'Town Center' || n === 'Castle', r = big ? 9 : n === 'Farm' ? 3.5 : 5.5;
      return '<g transform="translate(' + x + ',' + y + ')"><title>' + esc(n) + ' — ' + mmss(b[0] * 1000) + (b[1] ? ' (lui)' : ' (toi)') + '</title>'

        + (ic && n !== 'Farm' && n !== 'House' ? '<text font-size="' + (big ? 11 : 7.5) + '" text-anchor="middle" dy="0.35em">' + ic + '</text>' : '') + '</g>'; }).join('');
    if ($('mclicks').checked) h += g.map.clicks.filter(c => c[0] <= t && c[0] > t - 20).map(c => { const [x, y] = P(c[2], c[3]), o = (1 - (t - c[0]) / 20).toFixed(2);

    $('mlayer').innerHTML = h;
    $('mtime').textContent = mmss(t * 1000);
    const recent = ['me', 'him'].flatMap(w => g.timeline[w].filter(e => e[0] <= t && e[0] > t - 60).map(e => [e[0], w, e[2]])).sort((a, b) => b[0] - a[0]);

  }
  function gamePage(g) {
    const both = civs.includes(g.mine) && civs.includes(g.vs);
    const ageRow = label => '<tr><td>' + label + '</td>' + ['me', 'him'].map(w => { const x = g.ages[w][label];
      return '<td>' + (x ? 'clic ' + mmss(x[0]) + ' → ' + mmss(x[1]) + ' · ' + x[2] + ' vill.' : '—') + '</td>'; }).join('') + '</tr>';
    const at = m => Math.min(m, g.spent[0].length) - 1;
    const army = w => Object.entries(g.army[w]).map(([age, us]) => '<li><b>' + esc(age) + '</b> : ' + us.map(([u, c]) => c + ' ' + esc(u)).join(', ') + '</li>').join('');
    const render = () => {
      $('view').innerHTML = '<p><a href="#games">← Mes parties</a></p>'
        + '<div class="hero"><b>' + res(g) + ' ' + esc(g.mine) + ' vs ' + esc(g.vs) + '</b><span class="mut">' + day(g.started) + ' · ' + esc(g.map || '') + ' · ' + mmss(g.game_ms)
        + ' · ' + esc(g.account) + ' (' + g.rating + (g.ratingDiff ? ', ' + (g.ratingDiff > 0 ? '+' : '') + g.ratingDiff : '') + ') contre ' + esc(g.opp) + ' (' + (g.oppRating || '?') + ')'
        + ' · <a href="https://www.aoe2insights.com/match/' + g.match + '/" target="_blank" rel="noopener">AoE2 Insights</a>'
        + (both ? ' · <a href="#' + slug(g.mine) + '--' + slug(g.vs) + '">fiche du matchup</a>' : '') + '</span></div>'
        + '<ul class="flags big">' + g.flags.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>'
        + chart(g) + (g.timeline ? chrono(g) : '') + (g.map ? mapView(g) : '')
        + more('Détails', '<h4>Âges</h4><table><tr><th></th><th>Toi</th><th>Lui</th></tr>' + ['Féodal', 'Castle', 'Impérial'].map(ageRow).join('')
          + g.vills.map(([m, a, b]) => '<tr><td>Villageois à ' + m + ' min</td><td>' + a + '</td><td>' + b + '</td></tr>').join('') + '</table>'
          + '<h4>File du TC vide (≥ 8 s)</h4><p>' + (g.gaps.map(([a, b]) => mmss(a) + ' → ' + mmss(b) + ' (' + Math.round((b - a) / 1000) + ' s)').join(', ') || 'aucune') + '</p>'
          + '<h4>Ressources dépensées (cumul)</h4><table><tr><th>min</th><th>Toi</th><th>Lui</th></tr>'
          + [5, 10, 15, 20, 25, 30, 40].filter(m => m <= g.spent[0].length).map(m => '<tr><td>' + m + '</td><td>' + g.spent[0][at(m)] + '</td><td>' + g.spent[1][at(m)] + '</td></tr>').join('') + '</table>'
          + '<h4>Armée mise en file</h4><div class="cols"><div><b>Toi</b><ul>' + army('me') + '</ul></div><div><b>Lui</b><ul>' + army('him') + '</ul></div></div>'
          + '<p class="note">Lu dans les ordres du replay : villageois et unités = mis en file (un villageois qui attend la bouffe ne se voit pas), ressources = dépensées au coût de base, morts invisibles. Vraies stats : écran de fin du jeu ou CaptureAge.</p>');
      document.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { metric = b.dataset.metric; render(); });
      const seek = s => { mapT = Math.max(0, Math.min(Math.floor(g.game_ms / 1000), s)); if ($('mslider')) { $('mslider').value = mapT; drawMap(g); } };
      document.querySelectorAll('.chart i[data-m]').forEach(b => b.onclick = () => { seek(+b.dataset.m * 60 + 59); $('map').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
      document.querySelectorAll('.ev[data-s]').forEach(b => b.onclick = () => seek(+b.dataset.s + 5));
      if (!g.map) return;
      $('mslider').oninput = () => seek(+$('mslider').value);
      $('mclicks').onchange = () => drawMap(g);
      $('play').onclick = () => {
        if (playing) { clearInterval(playing); playing = null; $('play').textContent = '▶'; return; }
        $('play').textContent = '⏸';
        playing = setInterval(() => { if (mapT >= g.game_ms / 1000 || !$('mslider')) { clearInterval(playing); playing = null; if ($('play')) $('play').textContent = '▶'; return; } seek(mapT + 3); }, 100);
      };
      drawMap(g);
    };
    if (playing) { clearInterval(playing); playing = null; }
    mapT = Math.min(mapT, Math.floor(g.game_ms / 1000));
    render();
  }

  const [hm, ht] = location.hash.slice(1).split('--');
  const first = CARDS[0];
  $('mine').value = civs.find(c => slug(c) === hm) || (first && first.card.mine) || civs[0];
  $('theirs').value = civs.find(c => slug(c) === ht) || (first && first.card.theirs) || civs[0];
  $('civ').innerHTML = '<option value="">Toutes les civs</option>' + civNames.map(c => '<option>' + esc(c) + '</option>').join('');
  function route() {
    const civTab = !!STATS && location.hash.startsWith('#civ'), gameTab = location.hash.startsWith('#game');
    $('tabM').className = civTab || gameTab ? '' : 'on'; $('tabC').className = civTab ? 'on' : ''; $('tabG').className = gameTab ? 'on' : '';
    $('ctlM').hidden = civTab || gameTab; $('ctlC').hidden = !civTab; $('tabC').hidden = !STATS; $('tabG').hidden = !GAMES.length;
    if (gameTab) {
      const g = GAMES.find(x => '#game/' + x.match === location.hash);
      if (g) gamePage(g); else gamesList();
      return;
    }
    if (!civTab) {
      if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
      return;
    }
    const c = civNames.find(n => '#civ/' + slug(n) === location.hash);
    $('civ').value = c || '';
    if (c) civPage(c); else overview();
  }
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  $('civ').onchange = () => { location.hash = $('civ').value ? 'civ/' + slug($('civ').value) : 'civ'; };
  $('tabM').onclick = () => { history.replaceState(null, '', '#'); route(); };
  $('tabC').onclick = () => { location.hash = 'civ'; };
  $('tabG').onclick = () => { location.hash = 'games'; };
  window.addEventListener('hashchange', route);
  route();

  // Partie en cours (S91) : toutes les 10 s, l'API publique d'aoe2companion (CORS ouvert) dit si
  // un des comptes du joueur est en 1v1. Si oui : bandeau, puis la fiche du matchup, sinon la page
  // de la civ adverse, une seule fois par partie pour ne pas reprendre la main au joueur.
  let shownMatch = null, testUntil = 0;
  const clock = () => new Date().toLocaleTimeString('fr-FR');
  // Affiche une partie en cours : bandeau, puis le matchup (fiche rédigée ou vue auto), une fois par partie.
  let banner = null; // 'live' | 'test' | 'last' : la détection n'efface que son propre bandeau
  const mins = m => m.finished ? Math.round((Date.parse(m.finished) - Date.parse(m.started)) / 60000) + ' min' : '';
  function showMatch(m, kind) {
    const test = kind === 'test', last = kind === 'last';
    const players = m ? m.teams.flatMap(t => t.players) : [];
    const me = players.find(p => ME.includes(p.profileId)), him = players.find(p => !ME.includes(p.profileId));
    if (!m || players.length !== 2 || !me || !him) {
      if (banner !== 'last') { $('live').hidden = true; banner = null; }
      return false;
    }
    banner = kind; $('live').hidden = false;
    $('live').innerHTML = (test ? '🧪 <b>TEST</b> · ' : '')
      + (last ? '⏮ <b>Dernière partie</b> (' + esc(me.name) + ') : ' + (me.won ? '✅ gagnée' : me.won === false ? '❌ perdue' : '?') + ' · ' : '🔴 <b>En partie</b> : ')
      + esc(me.civName || '?') + ' contre ' + esc(him.civName || '?')
      + ' — ' + esc(him.name) + (him.rating ? ' (' + him.rating + ')' : '') + ' · ' + esc(m.mapName || '')
      + (last ? ' · ' + mins(m) + (me.ratingDiff ? ' · ' + (me.ratingDiff > 0 ? '+' : '') + me.ratingDiff + ' Elo' : '')
        + ' · <a href="https://www.aoe2insights.com/match/' + m.matchId + '/" target="_blank" rel="noopener">replay sur AoE2 Insights</a>'
        + ' · <a href="#" id="closeLast">✕</a>' : '');
    if (last) $('closeLast').onclick = e => { e.preventDefault(); $('live').hidden = true; banner = null; };
    if (shownMatch === m.matchId) return true;
    shownMatch = m.matchId;
    if (civs.includes(me.civName) && civs.includes(him.civName)) {
      $('mine').value = me.civName; $('theirs').value = him.civName; history.replaceState(null, '', '#'); route();
    }
    return true;
  }
  async function live() {
    if (document.hidden || !ME.length || Date.now() < testUntil) return;
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=3&profile_ids=' + ME.join(','));
      if (!r.ok) { $('liveStatus').textContent = clock() + ' · API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => !x.finished && Date.now() - Date.parse(x.started) < 3 * 3600e3);
      $('liveStatus').textContent = clock() + ' · ' + (showMatch(m, 'live') ? 'en partie' : 'pas en partie');
    } catch (e) { $('liveStatus').textContent = clock() + ' · réseau indisponible'; }
  }
  // 🧪 : une fausse partie (ta civ = « Ma civ », adversaire au hasard) passe par le même chemin
  // qu'une vraie ; la détection reprend 60 s plus tard.
  $('test').onclick = () => {
    const pick = () => civs[Math.floor(Math.random() * civs.length)];
    const mine = civs.includes($('mine').value) ? $('mine').value : pick();
    let theirs = pick(); while (theirs === mine && civs.length > 1) theirs = pick();
    testUntil = Date.now() + 60000;
    showMatch({ matchId: 'test-' + Date.now(), mapName: 'Arabia', teams: [
      { players: [{ profileId: ME[0], name: 'MoP', civName: mine }] },
      { players: [{ profileId: -1, name: 'Adversaire test', civName: theirs, rating: 1900 }] }] }, 'test');
    $('liveStatus').textContent = 'test : détection en pause 60 s';
  };
  // ⏮ : la dernière partie terminée du compte choisi (ou de tous), même bandeau et même matchup.
  try { $('acct').value = localStorage.getItem('acct') || ''; } catch (e) {}
  $('acct').onchange = () => { try { localStorage.setItem('acct', $('acct').value); } catch (e) {} };
  $('last').onclick = async () => {
    const ids = $('acct').value ? [$('acct').value] : ME;
    $('liveStatus').textContent = 'recherche de la dernière partie…';
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=10&profile_ids=' + ids.join(','));
      if (!r.ok) { $('liveStatus').textContent = 'API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => x.finished && x.teams.flatMap(t => t.players).length === 2);
      shownMatch = null;
      if (!m) { $('liveStatus').textContent = 'aucune partie 1v1 récente'; return; }
      showMatch(m, 'last');
      $('liveStatus').textContent = new Date(m.finished).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    } catch (e) { $('liveStatus').textContent = 'réseau indisponible'; }
  };
  live();
  setInterval(live, 10000);
  document.addEventListener('visibilitychange', live);
})();
</script>
</html>
