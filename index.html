<style>

  table { border-collapse: collapse; width: 100%; font-size: 14px; } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }

  .wr { font-variant-numeric: tabular-nums; white-space: nowrap; } .up { color: #3fb27f; } .dn { color: #e0605a; }
  .lead { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; } .hero b { font-size: 24px; }

  table.civs { max-width: 560px; }
  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin: 6px 0 12px; }
  .chip b { font-size: 14px; } .chips .chip { font-size: 13.5px; padding: 4px 11px; cursor: help; }
  @media (max-width: 1000px) { .tiles { grid-template-columns: 1fr 1fr; } } @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .opt { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 15px; } .opt span { white-space: nowrap; font-weight: 700; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--age); border-radius: 8px; padding: 10px 14px; }
  .tile .an { font-size: 12px; } .tv { font-size: 22px; font-weight: 800; margin: 2px 0; }
  .gl { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; } .fill { height: 100%; background: var(--age, var(--acc)); }
  .bar .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .legend { font-size: 12px; color: var(--mut); margin-top: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; color: var(--mut); }
</style>

au chez toi → Imp : Arbalest + Bracer + Halbs + Heavy Scorpions (Rocketry), là où il n'a ni Arbalest, ni Bracer, ni BBC.","why":"Les Cumans doivent gagner en Castle (S47 : Paladin + Kipchak ne suffisent pas en late contre une civ archer complète). Ton arbre chinois finit Arbalest + Bracer, le sien s'arrête au Crossbow ; sans BBC, il n'a rien contre des scorpions protégés (LATE1). Replays 1900+ Arabia : Chinese 58 % (n=185), Cumans 42 % (n=130), face-à-face Chinese 4 sur 4.","sources":["manual","S47","S43","S80","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Building","id":621,"age":3},{"civ":"Chinese","kind":"Building","id":82,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Unit","id":359,"age":4},{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4}]},"theirPlan":{"action":"2e TC dès le Féodal (près de la moitié des Cumans 1900+) ou bélier de Féodal → knights en Castle, parfois Steppe Lancers ou cav. archers, béliers et mangonneaux → Paladin + Kipchak + Hussar. Il doit te casser avant ton Imp.","why":"Bonus Cumans : un TC de plus en Féodal, atelier de siège et Battering Ram en Féodal, Capped Ram en Castle, montés +5/10/15 %, range et écurie -75 bois. Replays 1900+ : 58 Cumans sur 130 posent un TC en Féodal (médiane 9:29) ; en Castle, knights chez 35-45 % des joueurs ; Steppe Lancers ≥ 20 % de l'armée : 68 % de victoires (n=19, piste).","sources":["tree:Cumans","manual","S47","S80","S89"],"assets":[{"civ":"Cumans","kind":"Building","id":621,"age":2},{"civ":"Cumans","kind":"Unit","id":1258,"age":2},{"civ":"Cumans","kind":"Unit","id":38,"age":3},{"civ":"Cumans","kind":"Unit","id":1370,"age":3},{"civ":"Cumans","kind":"Unit","id":39,"age":3},{"civ":"Cumans","kind":"Unit","id":422,"age":3},{"civ":"Cumans","kind":"Unit","id":280,"age":3},{"civ":"Cumans","kind":"Unit","id":569,"age":4},{"civ":"Cumans","kind":"Unit","id":1231,"age":3},{"civ":"Cumans","kind":"Unit","id":441,"age":4}]},"phases":[{"age":2,"goal":"Faire payer son 2e TC : tes scouts sur ses vils dès ton arrivée en Féodal, puis archers. Jamais de bélier libre sur ton TC.","do":[{"action":"BO scouts : clic Féodal vers 6:40 (tes 3 villageois de départ en plus), Loom avant le clic, 2 fermes avant la fin des moutons, Horse Collar tôt.","why":"Chinese 1900+ : ouverture scouts 67 % de victoires (n=61), clic Féodal médian 6:39. Base food des scouts (SF1).","sources":["manual","S80","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2},{"civ":"Chinese","kind":"Tech","id":22,"age":1},{"civ":"Chinese","kind":"Tech","id":14,"age":2},{"civ":"Chinese","kind":"Building","id":50,"age":1},{"civ":"Chinese","kind":"Building","id":101,"age":2}]},{"action":"Tes 3 premiers scouts + ton scout de départ : direct sur son 2e TC (souvent posé vers 9:30). Vise ses vils au bois et aux baies hors de portée du TC.","why":"Chaque vil tué à son 2e TC retarde le boom qui paie ses knights de Castle (BOOM3 : punir l'expansion gourmande). Le TC tire : rester hors de sa portée.","sources":["manual","S80","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"action":"1 lancier à la fin du up, puis palissade autour de ton bois et de ton or.","why":"Ses scouts vont 5 % plus vite en Féodal ; le lancier tient ta base pendant que tes scouts sont chez lui (AF6).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":72,"age":1}]},{"action":"Range vers 11-12 min : archers + Fletching, 3-4 vils à l'or.","why":"Fin de Féodal : 65 % des Chinese 1900+ font des archers. Ses archers s'arrêteront au Crossbow ; les tiens vont jusqu'à l'Arbalest + Bracer : chaque archer qui survit compte.","sources":["S89","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2}]}],"ifSee":[{"trigger":"un bélier (atelier de siège dès son Féodal) qui avance vers ton TC","action":"8-10 vils + tes lanciers frappent le bélier ; tes scouts tuent son escorte. Pas d'archers dessus.","why":"Le Battering Ram a 180 d'armure perce et -3 d'armure mêlée : flèches inutiles, vils et lanciers le cassent.","sources":["tree:Cumans","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"une masse de scouts (ses écuries coûtent 75 bois de moins)","action":"3-4 lanciers sous ton TC, mur complet sans trou ; tes scouts rentrent avec les lanciers, archers derrière le mur.","why":"Il en produit plus que toi et plus vite : tes scouts seuls perdent. Les lanciers + le TC gagnent le combat chez toi (AF6).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":72,"age":1},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]},{"trigger":"ses archers","action":"Range jamais idle, Fletching tout de suite ; tes scouts chassent ses archers isolés. Au clic Castle : Crossbow + Bodkin en premier.","why":"Le premier au Crossbow + Bodkin gagne la guerre d'archers (AF4) ; tes techs coûtent -10 % en Castle.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3}]},{"trigger":"ses tirailleurs devant tes archers","action":"Tes scouts sur ses tirailleurs, tes archers derrière le mur. Pas de tirailleurs contre tirailleurs.","why":"Ses tirailleurs ne cassent pas tes murs ; tes scouts les tuent et tes archers restent en vie pour Castle (SF7, TR3).","sources":["manual","S69"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2}]}],"watch":[{"action":"Tes scouts n'entrent pas sous son TC garni : 5 vils dedans tuent un scout en quelques tirs.","why":"Le but est de lui coûter des vils et du temps, pas d'échanger tes scouts contre rien.","sources":["manual"],"assets":[]},{"action":"Pas de 2e TC chinois en Féodal : ton boom vient en Castle, derrière ton armée.","why":"Tu n'as pas son bonus ; un TC de Féodal sans armée devant est la cible de ses scouts plus rapides.","sources":["tree:Chinese","tree:Cumans"],"assets":[]}]},{"age":3,"goal":"Tenir sa poussée de Castle (knights, Steppe Lancers, béliers) sans perdre de TC, et boomer à 3 TC. S'il ne te casse pas en Castle, il a perdu le late.","do":[{"action":"Crossbow + Bodkin + Thumb Ring ; 10-15 arbalètes avec 6-8 piquiers devant.","why":"Début Castle des Chinese 1900+ : arbalètes chez 47 % des joueurs (69 % de victoires). Sa compo n°1 est le knight : les piquiers le tiennent, les arbalètes tirent derrière (B2).","sources":["manual","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3},{"civ":"Chinese","kind":"Tech","id":437,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]},{"action":"Pose 2 TC en Castle (3 au total), le 3e une fois tes piquiers sortis.","why":"Chinese 1900+ avec 2 TC posés en Castle : 72 % de victoires (n=68). Chaque TC donne aussi +15 de population.","sources":["S80","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":621,"age":3}]},{"action":"Château dans ta base, au-dessus des fermes. Pierre : 850 (2 TC + château).","why":"Il n'a ni BBC ni trébuchet avant l'Imp : un château chez toi tient ses knights et ses béliers (CA9b).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":82,"age":3}]},{"action":"Écurie : 3 knights qui ne servent qu'à tuer ses béliers et ses mangonneaux.","why":"Les flèches ne font rien aux béliers ; les knights tuent le siège et reviennent sous tes arbalètes.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3}]},{"action":"Monastère : 3-4 moines derrière la boule pour soigner et convertir ses knights.","why":"Contre une civ knights, les moines comptent dans le combat (ATK1).","sources":["manual","S41","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":104,"age":3},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]}],"ifSee":[{"trigger":"une masse de knights","action":"8-10 piquiers devant, arbalètes derrière, combat sous tes TC et ton château. Jamais tes arbalètes seules en terrain ouvert.","why":"Ses knights sont 10 % plus rapides que tes renforts : il gagne seulement si tu te bats loin de chez toi.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Steppe Lancers","action":"Même réponse, avec plus de piquiers ; une fois bloqués, tes arbalètes les fondent (60 PV, 1 d'armure perce).","why":"Le Steppe Lancer est sa meilleure piste en Castle chez les 1900+ (68 % quand ≥ 20 % de l'armée, n=19).","sources":["tree:Cumans","S80","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Kipchaks ou des cav. archers","action":"Elite Skirmisher : 8-10 tirailleurs avec tes arbalètes, sous tes TC.","why":"Les tirailleurs ne coûtent pas d'or et tiennent ses archers montés ; tes arbalètes restent pour ses knights.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3}]},{"trigger":"des béliers (Capped Ram dès son Castle) et des mangonneaux","action":"Tes 3 knights sur ses mangonneaux, tes piquiers et des vils sur les béliers ; arbalètes écartées en ligne.","why":"Ses mangonneaux tuent une boule d'arbalètes groupée ; ses béliers ne craignent que la mêlée.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]}],"watch":[{"action":"Pas de push forward en Castle : tu gagnes en attendant.","why":"En terrain ouvert ses montés plus rapides contournent tes piquiers ; chez toi, TC + château + piquiers les arrêtent.","sources":["manual","S47"],"assets":[]},{"action":"Garde 4-5 piquiers près de tes fermes : il a la cav la plus rapide de la partie.","why":"Montés Cumans +10 % en Castle : un raid sur fermes nues coûte plus que la bataille.","sources":["tree:Cumans"],"assets":[]}]},{"age":4,"goal":"Passer Imp sans perdre de TC, puis prendre la carte : Arbalest + Bracer et scorpions contre une civ sans Arbalest, sans Bracer, sans BBC.","do":[{"action":"Arbalester + Bracer dès le clic, puis Chemistry.","why":"Ses archers à pied s'arrêtent au Crossbow sans Bracer : ton tir à distance devient nettement meilleur (techs -15 % en Imp).","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Tech","id":47,"age":4}]},{"action":"Halberdier : 10-15 hallebardiers devant la boule.","why":"Paladin, Hussar et Steppe Lancer : toute sa fin de partie est montée.","sources":["tree:Cumans","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"action":"Heavy Scorpion + Rocketry + Ballistics : 6-10 scorpions derrière les halbs.","why":"Contre une civ sans BBC, des scorpions protégés sont un plan (LATE1) ; Rocketry leur donne +25 % d'attaque.","sources":["manual","S43","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4},{"civ":"Chinese","kind":"Tech","id":93,"age":3},{"civ":"Chinese","kind":"Building","id":49,"age":3}]},{"action":"2-3 trébuchets dans l'armée pour ses châteaux.","why":"Sans BBC, il ne peut tuer tes trébuchets qu'en chargeant à travers tes halbs.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":331,"age":4}]}],"ifSee":[{"trigger":"des Paladins","action":"Halbs devant, moines derrière, scorpions en arrière ; ne charge pas, laisse-le venir sous tes tirs.","why":"Le Paladin perd contre les halbs ; il ne gagne que contre une boule surprise en marche.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]},{"trigger":"des Hussars sur tes fermes","action":"6 halbs par groupe de fermes + vils dans les TC ; ta boule principale ne rentre pas.","why":"Ses raids servent à faire reculer ta boule ; ta Light Cav n'a pas Hussar et perd la poursuite.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"trigger":"des Siege Onagers ou des Onagers sur ta boule","action":"3-4 Cavaliers sur ses onagres, arbalètes et scorpions écartés.","why":"L'onagre est sa seule réponse à ta masse à distance ; tes Cavaliers le tuent avant le 2e tir.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":283,"age":4}]},{"trigger":"des Kipchaks ou des Heavy Cavalry Archers","action":"Elite Skirmishers + Arbalests ; tes scorpions restent pour ses knights.","why":"Tes tirailleurs Elite + Arbalests avec Bracer battent ses archers montés.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4}]}],"watch":[{"action":"Pas de Light Cav en masse : sans Hussar, elle perd contre ses Hussars.","why":"Arbre chinois : Light Cavalry seulement ; la sienne monte au Hussar.","sources":["tree:Chinese","tree:Cumans"],"assets":[]},{"action":"Si ton push échoue, pas de deuxième push en petits groupes : tiens chez toi, il n'a rien contre ton siège protégé.","why":"Le temps joue pour toi : il n'a ni Arbalest, ni Bracer, ni BBC.","sources":["manual","tree:Cumans"],"assets":[]}]}],"un         + (d.leads.length > 1 ? '<h4>Autres pistes</h4>' + d.leads.slice(1).map(leadLine).join('') : '')
        + '<h4>Clics médians</h4><p>Féodal ' + esc(d.clicks[0]) + ' · Castle ' + esc(d.clicks[1]) + ' · Impérial ' + esc(d.clicks[2])
          + ' (gagnants ' + esc(d.impClick[0]) + ', perdants ' + esc(d.impClick[1]) + ')</p>'
        + '<h4>Toutes les ouvertures</h4>' + list(d.openings.map(o => [o[0], o[1], ' · clic Castle ' + esc(o[2])]), false)
        + '<h4>Toutes les compositions Castle</h4>' + list(d.castle, true)
        + '<h4>Unité par unité en Castle : ≥ 20 % de l\'armée, contre sans</h4><ul>'
          + d.units.map(u => '<li>' + esc(nm(u[0], true)) + ' — ' + range(u[1]) + ' contre ' + range(u[2]) + '</li>').join('') + '</ul>'
        + '<h4>Toutes les compositions Impérial</h4>' + list(d.imperial, true)
        + '<h4>Techs prises en Castle</h4><table><tr><th>Tech</th><th>Joueurs</th><th>Gagnants</th><th>Perdants</th></tr>'
          + d.techs.map(t => '<tr><td>' + esc(t[0]) + '</td><td>' + t[1] + ' %</td><td>' + t[2] + ' %</td><td>' + t[3] + ' %</td></tr>').join('') + '</table>'
        + CAVEAT);
  }

  const [hm, ht] = location.hash.slice(1).split('--');
  const first = CARDS[0];
  $('mine').value = civs.find(c => slug(c) === hm) || (first && first.card.mine) || civs[0];
  $('theirs').value = civs.find(c => slug(c) === ht) || (first && first.card.theirs) || civs[0];
  $('civ').innerHTML = '<option value="">Toutes les civs</option>' + civNames.map(c => '<option>' + esc(c) + '</option>').join('');
  function route() {
    const civTab = !!STATS && location.hash.startsWith('#civ');
    $('tabM').className = civTab ? '' : 'on'; $('tabC').className = civTab ? 'on' : '';
    $('ctlM').hidden = civTab; $('ctlC').hidden = !civTab; $('tabC').hidden = !STATS;
    if (!civTab) {
      if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
      return;
    }
    const c = civNames.find(n => '#civ/' + slug(n) === location.hash);
    $('civ').value = c || '';
    if (c) civPage(c); else overview();
  }
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  $('civ').onchange = () => { location.hash = $('civ').value ? 'civ/' + slug($('civ').value) : 'civ'; };
  $('tabM').onclick = () => { history.replaceState(null, '', '#'); route(); };
  $('tabC').onclick = () => { location.hash = 'civ'; };
  window.addEventListener('hashchange', route);
  route();

  // Partie en cours (S91) : toutes les 10 s, l'API publique d'aoe2companion (CORS ouvert) dit si
  // un des comptes du joueur est en 1v1. Si oui : bandeau, puis la fiche du matchup, sinon la page
  // de la civ adverse, une seule fois par partie pour ne pas reprendre la main au joueur.
  let shownMatch = null, testUntil = 0;
  const clock = () => new Date().toLocaleTimeString('fr-FR');
  // Affiche une partie en cours : bandeau, puis le matchup (fiche rédigée ou vue auto), une fois par partie.
  function showMatch(m, test) {
    const players = m ? m.teams.flatMap(t => t.players) : [];
    const me = players.find(p => ME.includes(p.profileId)), him = players.find(p => !ME.includes(p.profileId));
    if (!m || players.length !== 2 || !me || !him) { $('live').hidden = true; return false; }
    $('live').hidden = false;
    $('live').innerHTML = (test ? '🧪 <b>TEST</b> · ' : '') + '🔴 <b>En partie</b> : ' + esc(me.civName || '?') + ' contre ' + esc(him.civName || '?')
      + ' — ' + esc(him.name) + (him.rating ? ' (' + him.rating + ')' : '') + ' · ' + esc(m.mapName || '');
    if (shownMatch === m.matchId) return true;
    shownMatch = m.matchId;
    if (civs.includes(me.civName) && civs.includes(him.civName)) {
      $('mine').value = me.civName; $('theirs').value = him.civName; history.replaceState(null, '', '#'); route();
    }
    return true;
  }
  async function live() {
    if (document.hidden || !ME.length || Date.now() < testUntil) return;
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=3&profile_ids=' + ME.join(','));
      if (!r.ok) { $('liveStatus').textContent = clock() + ' · API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => !x.finished && Date.now() - Date.parse(x.started) < 3 * 3600e3);
      $('liveStatus').textContent = clock() + ' · ' + (showMatch(m, false) ? 'en partie' : 'pas en partie');
    } catch (e) { $('liveStatus').textContent = clock() + ' · réseau indisponible'; }
  }
  // 🧪 : une fausse partie (ta civ = « Ma civ », adversaire au hasard) passe par le même chemin
  // qu'une vraie ; la détection reprend 60 s plus tard.
  $('test').onclick = () => {
    const pick = () => civs[Math.floor(Math.random() * civs.length)];
    const mine = civs.includes($('mine').value) ? $('mine').value : pick();
    let theirs = pick(); while (theirs === mine && civs.length > 1) theirs = pick();
    testUntil = Date.now() + 60000;
    showMatch({ matchId: 'test-' + Date.now(), mapName: 'Arabia', teams: [
      { players: [{ profileId: ME[0], name: 'MoP', civName: mine }] },
      { players: [{ profileId: -1, name: 'Adversaire test', civName: theirs, rating: 1900 }] }] }, true);
    $('liveStatus').textContent = 'test : détection en pause 60 s';
  };
  live();
  setInterval(live, 10000);
  document.addEventListener('visibilitychange', live);
})();
</script>
</html>
