e plus en Féodal, atelier de siège et Battering Ram en Féodal, Capped Ram en Castle, montés +5/10/15 %, range et écurie -75 bois. Replays 1900+ : 58 Cumans sur 130 posent un TC en Féodal (médiane 9:29) ; en Castle, knights chez 35-45 % des joueurs ; Steppe Lancers ≥ 20 % de l'armée : 68 % de victoires (n=19, piste).","sources":["tree:Cumans","manual","S47","S80","S89"],"assets":[{"civ":"Cumans","kind":"Building","id":621,"age":2},{"civ":"Cumans","kind":"Unit","id":1258,"age":2},{"civ":"Cumans","kind":"Unit","id":38,"age":3},{"civ":"Cumans","kind":"Unit","id":1370,"age":3},{"civ":"Cumans","kind":"Unit","id":39,"age":3},{"civ":"Cumans","kind":"Unit","id":422,"age":3},{"civ":"Cumans","kind":"Unit","id":280,"age":3},{"civ":"Cumans","kind":"Unit","id":569,"age":4},{"civ":"Cumans","kind":"Unit","id":1231,"age":3},{"civ":"Cumans","kind":"Unit","id":441,"age":4}]},"phases":[{"age":2,"goal":"Faire payer son 2e TC : tes scouts sur ses vils dès ton arrivée en Féodal, puis archers. Jamais de bélier libre sur ton TC.","do":[{"action":"BO scouts : clic Féodal vers 6:40 (tes 3 villageois de départ en plus), Loom avant le clic, 2 fermes avant la fin des moutons, Horse Collar tôt.","why":"Chinese 1900+ : ouverture scouts 67 % de victoires (n=61), clic Féodal médian 6:39. Base food des scouts (SF1).","sources":["manual","S80","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2},{"civ":"Chinese","kind":"Tech","id":22,"age":1},{"civ":"Chinese","kind":"Tech","id":14,"age":2},{"civ":"Chinese","kind":"Building","id":50,"age":1},{"civ":"Chinese","kind":"Building","id":101,"age":2}]},{"action":"Tes 3 premiers scouts + ton scout de départ : direct sur son 2e TC (souvent posé vers 9:30). Vise ses vils au bois et aux baies hors de portée du TC.","why":"Chaque vil tué à son 2e TC retarde le boom qui paie ses knights de Castle (BOOM3 : punir l'expansion gourmande). Le TC tire : rester hors de sa portée.","sources":["manual","S80","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"action":"1 lancier à la fin du up, puis palissade autour de ton bois et de ton or.","why":"Ses scouts vont 5 % plus vite en Féodal ; le lancier tient ta base pendant que tes scouts sont chez lui (AF6).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":72,"age":1}]},{"action":"Range vers 11-12 min : archers + Fletching, 3-4 vils à l'or.","why":"Fin de Féodal : 65 % des Chinese 1900+ font des archers. Ses archers s'arrêteront au Crossbow ; les tiens vont jusqu'à l'Arbalest + Bracer : chaque archer qui survit compte.","sources":["S89","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2}]}],"ifSee":[{"trigger":"un bélier (atelier de siège dès son Féodal) qui avance vers ton TC","action":"8-10 vils + tes lanciers frappent le bélier ; tes scouts tuent son escorte. Pas d'archers dessus.","why":"Le Battering Ram a 180 d'armure perce et -3 d'armure mêlée : flèches inutiles, vils et lanciers le cassent.","sources":["tree:Cumans","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"une masse de scouts (ses écuries coûtent 75 bois de moins)","action":"3-4 lanciers sous ton TC, mur complet sans trou ; tes scouts rentrent avec les lanciers, archers derrière le mur.","why":"Il en produit plus que toi et plus vite : tes scouts seuls perdent. Les lanciers + le TC gagnent le combat chez toi (AF6).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":72,"age":1},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]},{"trigger":"ses archers","action":"Range jamais idle, Fletching tout de suite ; tes scouts chassent ses archers isolés. Au clic Castle : Crossbow + Bodkin en premier.","why":"Le premier au Crossbow + Bodkin gagne la guerre d'archers (AF4) ; tes techs coûtent -10 % en Castle.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3}]},{"trigger":"ses tirailleurs devant tes archers","action":"Tes scouts sur ses tirailleurs, tes archers derrière le mur. Pas de tirailleurs contre tirailleurs.","why":"Ses tirailleurs ne cassent pas tes murs ; tes scouts les tuent et tes archers restent en vie pour Castle (SF7, TR3).","sources":["manual","S69"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2}]}],"watch":[{"action":"Tes scouts n'entrent pas sous son TC garni : 5 vils dedans tuent un scout en quelques tirs.","why":"Le but est de lui coûter des vils et du temps, pas d'échanger tes scouts contre rien.","sources":["manual"],"assets":[]},{"action":"Pas de 2e TC chinois en Féodal : ton boom vient en Castle, derrière ton armée.","why":"Tu n'as pas son bonus ; un TC de Féodal sans armée devant est la cible de ses scouts plus rapides.","sources":["tree:Chinese","tree:Cumans"],"assets":[]}]},{"age":3,"goal":"Tenir sa poussée de Castle (knights, Steppe Lancers, béliers) sans perdre de TC, et boomer à 3 TC. S'il ne te casse pas en Castle, il a perdu le late.","do":[{"action":"Crossbow + Bodkin + Thumb Ring ; 10-15 arbalètes avec 6-8 piquiers devant.","why":"Début Castle des Chinese 1900+ : arbalètes chez 47 % des joueurs (69 % de victoires). Sa compo n°1 est le knight : les piquiers le tiennent, les arbalètes tirent derrière (B2).","sources":["manual","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3},{"civ":"Chinese","kind":"Tech","id":437,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]},{"action":"Pose 2 TC en Castle (3 au total), le 3e une fois tes piquiers sortis.","why":"Chinese 1900+ avec 2 TC posés en Castle : 72 % de victoires (n=68). Chaque TC donne aussi +15 de population.","sources":["S80","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":621,"age":3}]},{"action":"Château dans ta base, au-dessus des fermes. Pierre : 850 (2 TC + château).","why":"Il n'a ni BBC ni trébuchet avant l'Imp : un château chez toi tient ses knights et ses béliers (CA9b).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":82,"age":3}]},{"action":"Écurie : 3 knights qui ne servent qu'à tuer ses béliers et ses mangonneaux.","why":"Les flèches ne font rien aux béliers ; les knights tuent le siège et reviennent sous tes arbalètes.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3}]},{"action":"Monastère : 3-4 moines derrière la boule pour soigner et convertir ses knights.","why":"Contre une civ knights, les moines comptent dans le combat (ATK1).","sources":["manual","S41","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":104,"age":3},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]},{"action":"Wheelbarrow à 18 fermes, même si un TC idle ~75 s (3 vils retardés). Avec tes archers, ça tombe plutôt 3-6 min après le clic Castle. Hand Cart dès que 500 ressources passent sans couper TC, vils ou armée.","why":"Wheelbarrow coûte 3 vils de temps TC et rapporte plus qu'eux à 18-19 fermiers ; ensuite 18 fermes rendent comme ~21. 1900+ Arabia : prise 3-6 min après le clic Castle = 60 % de victoires (n=644), toujours pas prise à Castle+12 = 41 % (corrélation) (MACRO11).","sources":["manual","S138"],"assets":[{"civ":"Chinese","kind":"Tech","id":213,"age":3},{"civ":"Chinese","kind":"Tech","id":249,"age":3}]}],"ifSee":[{"trigger":"une masse de knights","action":"8-10 piquiers devant, arbalètes derrière, combat sous tes TC et ton château. Jamais tes arbalètes seules en terrain ouvert.","why":"Ses knights sont 10 % plus rapides que tes renforts : il gagne seulement si tu te bats loin de chez toi.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Steppe Lancers","action":"Même réponse, avec plus de piquiers ; une fois bloqués, tes arbalètes les fondent (60 PV, 1 d'armure perce).","why":"Le Steppe Lancer est sa meilleure piste en Castle chez les 1900+ (68 % quand ≥ 20 % de l'armée, n=19).","sources":["tree:Cumans","S80","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Kipchaks ou des cav. archers","action":"Elite Skirmisher : 8-10 tirailleurs avec tes arbalètes, sous tes TC.","why":"Les tirailleurs ne coûtent pas d'or et tiennent ses archers montés ; tes arbalètes restent pour ses knights.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3}]},{"trigger":"des béliers (Capped Ram dès son Castle) et des mangonneaux","action":"Tes 3 knights sur ses mangonneaux, tes piquiers et des vils sur les béliers ; arbalètes écartées en ligne.","why":"Ses mangonneaux tuent une boule d'arbalètes groupée ; ses béliers ne craignent que la mêlée.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]}],"watch":[{"action":"Pas de push forward en Castle : tu gagnes en attendant.","why":"En terrain ouvert ses montés plus rapides contournent tes piquiers ; chez toi, TC + château + piquiers les arrêtent.","sources":["manual","S47"],"assets":[]},{"action":"Garde 4-5 piquiers près de tes fermes : il a la cav la plus rapide de la partie.","why":"Montés Cumans +10 % en Castle : un raid sur fermes nues coûte plus que la bataille.","sources":["tree:Cumans"],"assets":[]}]},{"age":4,"goal":"Passer Imp sans perdre de TC, puis prendre la carte : Arbalest + Bracer et scorpions contre une civ sans Arbalest, sans Bracer, sans BBC.","do":[{"action":"Arbalester + Bracer dès le clic, puis Chemistry.","why":"Ses archers à pied s'arrêtent au Crossbow sans Bracer : ton tir à distance devient nettement meilleur (techs -15 % en Imp).","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Tech","id":47,"age":4}]},{"action":"Halberdier : 10-15 hallebardiers devant la boule.","why":"Paladin, Hussar et Steppe Lancer : toute sa fin de partie est montée.","sources":["tree:Cumans","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"action":"Heavy Scorpion + Rocketry + Ballistics : 6-10 scorpions derrière les halbs.","why":"Contre une civ sans BBC, des scorpions protégés sont un plan (LATE1) ; Rocketry leur donne +25 % d'attaque.","sources":["manual","S43","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4},{"civ":"Chinese","kind":"Tech","id":93,"age":3},{"civ":"Chinese","kind":"Building","id":49,"age":3}]},{"action":"2-3 trébuchets dans l'armée pour ses châteaux.","why":"Sans BBC, il ne peut tuer tes trébuchets qu'en chargeant à travers tes halbs.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":331,"age":4}]}],"ifSee":[{"trigger":"des Paladins","action":"Halbs devant, moines derrière, scorpions en arrière ; ne charge pas, laisse-le venir sous tes tirs.","why":"Le Paladin perd contre les halbs ; il ne gagne que contre une boule surprise en marche.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]},{"trigger":"des Hussars sur tes fermes","action":"6 halbs par groupe de fermes + vils dans les TC ; ta boule principale ne rentre pas.","why":"Ses raids servent à faire reculer ta boule ; ta Light Cav n'a pas Hussar et perd la poursuite.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"trigger":"des Siege Onagers ou des Onagers sur ta boule","action":"3-4 Cavaliers sur ses onagres, arbalètes et scorpions écartés.","why":"L'onagre est sa seule réponse à ta masse à distance ; tes Cavaliers le tuent avant le 2e tir.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":283,"age":4}]},{"trigger":"des Kipchaks ou des Heavy Cavalry Archers","action":"Elite Skirmishers + Arbalests ; tes scorpions restent pour ses knights.","why":"Tes tirailleurs Elite + Arbalests avec Bracer battent ses archers montés.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4}]}],"watch":[{"action":"Pas de Light Cav en masse : sans Hussar, elle perd contre ses Hussars.","why":"Arbre chinois : Light Cavalry seulement ; la sienne monte au Hussar.","sources":["tree:Chinese","tree:Cumans"],"assets":[]},{"action":"Si ton push échoue, pas de deuxième push en petits groupes : tiens chez toi, il n'a rien contre ton siège protégé.","why":"Le temps joue pour toi : il n'a ni Arbalest, ni Bracer, ni BBC.","sources":["manual","tree:Cumans"],"assets":[]}]}],"uncertainties":["Brouillon : pas encore relu avec toi. Pas de BO chiffré au-delà des temps de clic mesurés.","Fire Lancer et Rocket Cart : rôle dans ce matchup non évalué (rares dans les replays Chinese 1900+).","Statistiques : face-à-face 4 parties seulement ; pistes 1900+ Arabia à n faible (Steppe Lancer n=19).","Tes 8 parties Chinese contre Cumans (4 défaites) : on ne sait pas encore comment elles ont été perdues."],"glance":{"plan":"Scouts sur son 2e TC → archers → 3 TC derrière arbalètes + piquiers → Imp : Arbalest + Halbs + scorpions","them":"2e TC ou bélier en Féodal → knights / Steppe Lancers + béliers en Castle → Paladin + Kipchak","phases":["Scouts sur son 2e TC · lanciers + vils sur ses béliers · archers ensuite","Arbalètes + piquiers · 3 TC · château chez toi · 3 knights contre son siège","Arbalest + Bracer · Halbs · scorpions Rocketry (pas de BBC chez lui)"]}}},{"key":"chinese::magyars","version":"chinese-magyars-v2","status":"draft","createdAt":"2026-11-15","dataVersion":"2e6445133bf7","card":{"mine":"Chinese","theirs":"Magyars","gamePlan":{"action":"Archers + lanciers contre ses scouts → au Castle, Elite Skirm + scorpions contre ses CA et 3 TC → château dans ta base → Imp avant lui (techs -15 %) → push Arbalètes + Heavy Scorpions Rocketry + Halbs avant que ses Hussars et Huszars full-upgrade arrivent.","why":"Magyars : éco sans bonus (S63), win-con CA + Hussar/Huszar, pas de BBC. Chinese : +3 villageois de départ et techs moins chères, archers et tirailleurs complets, mais ni Heavy CA, ni Parthian, ni Hussar, ni Paladin : tu perds le miroir CA et la guerre de trash tardive. Tu gagnes sur l'éco et un timing Imp (INIT1, IMP2, LATE1).","sources":["manual","S63","S40","tree:Chinese","tree:Magyars"],"assets":[{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Unit","id":6,"age":3},{"civ":"Chinese","kind":"Unit","id":279,"age":3},{"civ":"Chinese","kind":"Building","id":621,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Unit","id":359,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4}]},"theirPlan":{"action":"Scouts (68 % des Magyars 1900+) → archers ou tirailleurs en fin de Féodal → Cav Archers en Castle (52 % en début de Castle), parfois knights ou mangonneaux → Imp : CA (Recurve Bow, Parthian) + Magyar Huszar + Hussar.","why":"Scouts -15 % et attaque mêlée gratuite = initiative en Féodal ; une civ CA ouvre scouts pour garder écurie et Fletching utiles à ses CA (S61). Chiffres : replays RM 1v1 ≥ 1900 Arabia (S85, S89), des pistes, pas des preuves.","sources":["S63","S61","S85","S89","tree:Magyars"],"assets":[{"civ":"Magyars","kind":"Unit","id":448,"age":2},{"civ":"Magyars","kind":"Unit","id":39,"age":3},{"civ":"Magyars","kind":"Unit","id":869,"age":3},{"civ":"Magyars","kind":"Unit","id":441,"age":4},{"civ":"Magyars","kind":"Tech","id":515,"age":4}]},"phases":[{"age":2,"goal":"Survivre à ses scouts sans perdre de villageois, garder tes archers en vie et le pousser sur les tirailleurs : c'est sa pire fin de Féodal.","do":[{"action":"Up archers : barracks puis range. 1er lancier dès le clic Féodal, 2e à l'arrivée ; ils restent près de tes villageois exposés.","why":"68 % des Magyars 1900+ ouvrent scouts (n=93). Le lancier prêt à l'arrivée empêche ses scouts de tuer des villageois (S18, AF1).","sources":["manual","S18","S85"],"assets":[{"civ":"Chinese","kind":"Building","id":12,"age":2},{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]},{"action":"Poke pendant Fletching : 2 archers + 1 lancier + ton scout, sur ses baies.","why":"Forcer sa range de tirailleurs pendant qu'il a investi en food ; viser les baies retarde ses fermes et donc sa range (AF1, AF1b).","sources":["manual","S18"],"assets":[{"civ":"Chinese","kind":"Tech","id":199,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Unit","id":93,"age":2}]},{"action":"Mur : 2 villageois ferment ton or et ton bois avant 12 min.","why":"Une civ scouts dicte en Féodal tant que ton éco est ouverte ; fermé, ses scouts ne font plus de dégâts et ses archers ou tirailleurs ne cassent pas un mur.","sources":["manual","S18"],"assets":[{"civ":"Chinese","kind":"Building","id":117,"age":2}]},{"action":"13 fermes pour le Castle et 3 villageois à la pierre dès 14 min : 2 TC en début de Castle = 200 pierre, château ensuite = 650 (850 en tout).","why":"Le plan Castle est un boom 3 TC puis un château dans ta base : la pierre doit être prête au clic (MACRO3, MACRO8).","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":50,"age":2},{"civ":"Chinese","kind":"Building","id":584,"age":2}]}],"ifSee":[{"trigger":"6 scouts ou plus dans ta base","action":"3-4 lanciers sous ton TC, mur complet, tes archers tirent derrière les lanciers. Pas de sortie avant que ses scouts reculent.","why":"Ses scouts ont l'attaque mêlée gratuite : en terrain ouvert, ils gagnent. Sous le TC et derrière les lanciers, c'est lui qui perd des unités.","sources":["manual","S63","tree:Magyars"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2}]},{"trigger":"ses tirailleurs seuls sur la carte (il a lâché ses scouts)","action":"Tes archers rentrent derrière le mur ; 3 scouts à toi chassent ses tirailleurs.","why":"Les tirailleurs ne battent pas les scouts. Les Magyars 1900+ qui finissent le Féodal en tirailleurs gagnent 32 % (n=28) : ne rends pas ce choix rentable en échangeant tes archers.","sources":["manual","S89"],"assets":[{"civ":"Chinese","kind":"Building","id":101,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"il passe archers en fin de Féodal (47 % des Magyars)","action":"5-6 tirailleurs sous ton TC + tes archers derrière le mur ; pas de duel archers contre archers en terrain ouvert.","why":"Ses archers préparent ses CA (même range, Fletching). Les tirailleurs coûtent sans or et te laissent l'or pour le Castle.","sources":["manual","S61","S89"],"assets":[{"civ":"Chinese","kind":"Unit","id":7,"age":2}]},{"trigger":"des M@A (15 % des Magyars)","action":"Archers derrière le mur, ils kitent ; pas de lancier contre l'infanterie.","why":"L'infanterie se fait kiter par les archers (B2). Ses M@A ne cassent pas vite un mur fermé.","sources":["manual","S56"],"assets":[{"civ":"Chinese","kind":"Unit","id":4,"age":2}]}],"watch":[{"action":"Pas de miroir scouts : à nombre égal, ses scouts gagnent (+1 attaque gratuite, -15 % de coût).","why":"Bonus Magyars lus dans l'arbre ; S63 : ses scouts tiennent l'initiative.","sources":["tree:Magyars","S63"],"assets":[]},{"action":"Ses tirailleurs ne veulent pas dire que ton ouverture a raté : c'est la réponse attendue. Arrête la range quand il est fermé et mets tout en éco.","why":"TEMPO2 : l'armée achète du temps, l'éco gagne la partie.","sources":["manual","S71"],"assets":[]}]},{"age":3,"goal":"Boom à 3 TC derrière une armée que ses CA ne tuent pas : Elite Skirm + quelques scorpions. Son éco est faible : il doit raider, tu ne lui donnes rien.","do":[{"action":"Au clic Castle : 2 TC tout de suite (3 au total), Gold Mining, Bow Saw.","why":"Les Chinese 1900+ qui gagnent prennent Gold Mining (78 % contre 59 % chez ceux qui perdent) ; tes techs coûtent -10 % en Castle.","sources":["S85","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":621,"age":3},{"civ":"Chinese","kind":"Tech","id":55,"age":3},{"civ":"Chinese","kind":"Tech","id":203,"age":3}]},{"action":"Contre ses CA : Elite Skirmisher en production continue sur 2 ranges ; tes archers existants restent derrière, plus de nouveaux Crossbows.","why":"Les tirailleurs ont un bonus contre les CA et ne coûtent pas d'or. Ne pas mélanger deux productions d'archerie en début de Castle (CA2).","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3},{"civ":"Chinese","kind":"Building","id":87,"age":3}]},{"action":"Atelier de siège : 2-3 scorpions derrière les tirailleurs.","why":"7 d'armure perçante : ses CA ne les tuent pas ; portée 7 contre ses CA à 4-5. Tu n'as pas de mangonneau (CA10, plan A).","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":49,"age":3},{"civ":"Chinese","kind":"Unit","id":279,"age":3}]},{"action":"Padded puis Leather Archer Armor, Ballistics.","why":"Tes tirailleurs et archers prennent les flèches de ses CA ; Ballistics sert contre des unités qui bougent.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Tech","id":211,"age":3},{"civ":"Chinese","kind":"Tech","id":212,"age":3},{"civ":"Chinese","kind":"Tech","id":93,"age":3}]},{"action":"Chât u","kind":"Building","id":87,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2},{"civ":"Shu","kind":"Unit","id":4,"age":2}]},{"action":"Poke pendant Fletching : 2 archers + 1 lancier + ton scout, sur ses baies.","why":"Version avec Fletching car Shu masse ses archers et paie ses technologies d'archerie -25 % (AF1, S23). Les Francs prennent les baies en premier (fourrageurs +15 %) : les toucher le force aux fermes et retarde sa range de tirailleurs (AF1b).","sources":["manual","S22","S23","tree:Shu","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":4,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2},{"civ":"Shu","kind":"Unit","id":448,"age":2},{"civ":"Shu","kind":"Tech","id":199,"age":2}]},{"action":"Pendant que tes archers traversent : 2 vils ferment le mur. Mur fini avant 13 min, ton or jamais accessible à ses unités.","why":"La fenêtre calme sert à tout préparer avant le micro (AF2, MACRO2).","sources":["manual","S18"],"assets":[{"civ":"Shu","kind":"Building","id":72,"age":2},{"civ":"Shu","kind":"Building","id":117,"age":2}]},{"action":"13 fermes pour le Castle. Mets des vils à la pierre dès le Féodal : le plan en demande 850 (2 TC + château), 975 avec une tour.","why":"13 fermes suffisent pour les ~800 de nourriture du Castle avec des archers (MACRO8). TC = 100 pierre, château = 650 (données). Un château se décide une phase avant : sans pierre au clic, il arrive trop tard (DEADLINE1).","sources":["manual","S49","S74","S77","tree:Shu"],"assets":[]}],"ifSee":[{"trigger":"ses tirailleurs campent devant ton mur, ton bois ou ton or","action":"Mur + tour : une Watch Tower sur la ressource visée, tes archers derrière le mur.","why":"Ses tirailleurs ne cassent pas les murs (2-3 dégâts, SF7) et la tour tire sur eux. Tes archers restent en vie pour Castle. Coût : 125 pierre prises sur le château.","sources":["manual","S14","S69","S77","tree:Shu","S78"],"assets":[{"civ":"Shu","kind":"Building","id":79,"age":2},{"civ":"Shu","kind":"Building","id":117,"age":2}]},{"trigger":"il a lâché ses scouts : ses tirailleurs sont seuls sur la carte","action":"3-4 scouts chassent ses tirailleurs ; tes archers restent derrière.","why":"Les scouts battent les tirailleurs (roue B). Seulement sans ses scouts (+20 % PV), qui battent les tiens (TR3). Ça coûte de la nourriture, pas d'or.","sources":["manual","S20","S77","strings","S78"],"assets":[{"civ":"Shu","kind":"Building","id":101,"age":2},{"civ":"Shu","kind":"Unit","id":448,"age":2}]},{"trigger":"il pousse tirailleurs + quelques scouts contre ta base","action":"Tes propres tirailleurs, en défense seulement, avec tes lanciers et sous ton TC. Garde l'or pour le château et le boom.","why":"Tirailleur = 25 nourriture / 35 bois, sans or : ton or reste pour le Castle (TR4). Jamais en avant : ses scouts mangent tes renforts (TR3).","sources":["manual","S77","tree:Shu","S78"],"assets":[{"civ":"Shu","kind":"Unit","id":7,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2}]},{"trigger":"une masse de scouts","action":"Mur complet sans trou au TC, lanciers, reste chez toi.","why":"Ses scouts +20 % PV défoncent les archers à découvert (AF6).","sources":["manual","S18","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":93,"age":2}]}],"watch":[{"action":"Ses tirailleurs ne veulent pas dire que ton ouverture a raté : c'est la réponse attendue. Ne prends jamais archers contre tirailleurs en terrain ouvert.","why":"Après scouts il va quasi toujours tirailleurs, faute d'or (S23). Ton gain : ta masse conservée et sa dépense en unités qui ne scalent pas (TR5).","sources":["manual","S23"],"assets":[]},{"action":"Plus aucun dégât possible (lui muré) : arrête les archers, mets tout en éco.","why":"L'armée sert à faire des dégâts (MACRO7).","sources":["manual","S16"],"assets":[]}]},{"age":3,"goal":"Boom à 3 TC derrière un écran Xbow + mangonneaux, château défensif au-dessus des fermes. Il est pauvre en début de Castle : il ne doit rien te prendre.","do":[{"action":"Crossbow + Bodkin, Thumb Ring dès que la masse tient. Boule toujours groupée.","why":"Ta masse est ton écran puis ton timing ; ces technologies coûtent -25 % pour Shu. Une boule de Xbow tient les chevaliers dans un passage étroit (B2).","sources":["manual","S56","tree:Shu","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":24,"age":3},{"civ":"Shu","kind":"Tech","id":200,"age":3},{"civ":"Shu","kind":"Tech","id":437,"age":3}]},{"action":"Atelier de siège : mangonneaux en défense.","why":"Le mangonneau déchire ses tirailleurs et ses scorpions (CA4, CA7). Tes engins vont plus vite (+10 %). Il n'a pas Redemption : ses moines ne convertissent pas ton siège.","sources":["manual","S18","S25","tree:Franks","strings"],"assets":[{"civ":"Shu","kind":"Building","id":49,"age":3},{"civ":"Shu","kind":"Unit","id":280,"age":3}]},{"action":"3 TC au total ; le 3e seulement quand ta défense tient.","why":"Plan du joueur : boom (S77). Un seul plan, payé en entier (MIX1). 3e TC quand la défense est assurée (TEMPO2).","sources":["manual","S74","S77"],"assets":[{"civ":"Shu","kind":"Building","id":109,"age":3}]},{"action":"Château dans ta base, au-dessus de tes fermes.","why":"Choix du joueur (S77). Contre une civ qui raide, le château couvre l'éco (CAST1), et il produit tes White Feather Guards.","sources":["manual","S75","S77"],"assets":[{"civ":"Shu","kind":"Building","id":82,"age":3}]},{"action":"Monastère : quelques moines contre ses premiers chevaliers et pour soigner.","why":"Piquiers et moines écrasent les chevaliers (B2). Shu n'a ni Sanctity, ni Block Printing, ni Redemption : moines en soutien, pas en pilier.","sources":["manual","S56","tree:Shu"],"assets":[{"civ":"Shu","kind":"Building","id":104,"age":3},{"civ":"Shu","kind":"Unit","id":125,"age":3}]},{"action":"Wheelbarrow à 18 fermes, même si un TC idle ~75 s (3 vils retardés). Avec tes archers, ça tombe plutôt 3-6 min après le clic Castle. Hand Cart dès que 500 ressources passent sans couper TC, vils ou armée.","why":"Wheelbarrow coûte 3 vils de temps TC et rapporte plus qu'eu   const civs = [...new Set([...CARDS.flatMap(e => [e.card.mine, e.card.theirs]), ...Object.keys(STATS ? STATS.civs : {})])].sort();
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  for (const id of ['mine', 'theirs']) $(id).innerHTML = civs.map(c => '<option>' + esc(c) + '</option>').join('');

  function show() {
    const m = $('mine').value, t = $('theirs').value;
    const e = CARDS.find(x => x.card.mine === m && x.card.theirs === t);

    const c = e.card, g = c.glance;
    // Niveau 1, lisible en 4 s : le plan et une ligne par âge (« glance », fiches v3).
    // Niveau 2, au clic : tout le détail de la fiche.
    const detail = p => '<div class="goal">🎯 ' + esc(p.goal) + '</div><ul>' + p.do.map(item).join('') + '</ul>'
      + (p.ifSee.length ? '<h4>🔀 Si tu vois…</h4>' + p.ifSee.map(b => '<div class="si"><div class="tr">' + esc(b.trigger) + '</div><div>' + esc(b.action) + why(b.why) + '</div></div>').join('') : '')

  }
  // Civ pages: what 1900+ players do on Arabia, measured on their replays.
  const pct = t => Math.round(100 * t[0] / t[1]);
  // « 69 % (entre 57 et 81 %) » : la fourchette à 95 %, plus lisible que « ±12 ».
  const range = t => { const [w, n] = t; if (n < 10) return w + ' sur ' + n;
    const p = w / n, e = 1.96 * Math.sqrt(p * (1 - p) / n);
    return Math.round(100 * p) + ' % (entre ' + Math.max(0, Math.round(100 * (p - e))) + ' et ' + Math.min(100, Math.round(100 * (p + e))) + ' %)'; };
  const civNames = STATS ? Object.keys(STATS.civs) : [];
  // Noms courts pour la lecture rapide ; le nom complet reste au survol.
  const SHORT = { 'Scout/cav. légère': 'Scouts', 'Archer/arbalète': 'Archers', 'Tirailleur': 'Tirailleurs', 'M@A/épée': 'M@A',

  // Couleur seulement quand la fourchette à 95 % ne contient pas 50 % : sinon, c'est du bruit.
  const tone = t => { const [w, n] = t; if (n < 10) return 'flat'; const p = w / n, e = 1.96 * Math.sqrt(p * (1 - p) / n);
    return p - e > 0.5 ? 'good' : p + e < 0.5 ? 'bad' : 'flat'; };
  const winNum = t => '<span class="' + tone(t) + '">' + (t[1] < 10 ? t[0] + '/' + t[1] : pct(t) + ' %') + '</span>';
  const tip = (full, t, extra) => esc(full + ' — ' + t[1] + ' parties, gagne ' + range(t) + (extra || ''));
  // Une ligne = nom · barre (part des parties) · % de victoires. Détail au survol.

  const top = rows => { const big = rows.filter(r => r[1][1] >= 10); return (big.length ? big : rows).slice(0, 4); };
  const leadText = l => esc(l[0].replace(/ ≥ 20 % en Castle$/, ' en Castle').replace(/^ouverture /, 'Ouverture ')

  const CAVEAT = STATS ? '<p class="note">Replays ' + esc(STATS.scope) + ', relus le ' + esc(STATS.builtAt) + '. '

      : '<div class="mut">pas assez de parties</div>') + '</div>';
  const PH = { feudal_late: [2, 'FIN FÉODAL'], castle_early: [3, 'DÉBUT CASTLE'], castle_late: [3, 'FIN CASTLE'], imp_early: [4, 'DÉBUT IMP'], imp_late: [4, 'FIN IMP'] };
  const phaseTiles = d => '<div class="tiles">' + tile(2, 'DÉBUT FÉODAL', d.openings, d.all[1], false)
    + d.phases.map(([k, n, opts]) => tile(PH[k][0], PH[k][1], opts, n, k !== 'feudal_late')).join('') + '</div>';
  // Aide oui/non : ✅ si ceux qui le font gagnent nettement plus, ❌ nettement moins, ~ sinon (test à 95 %).
  const verdict = (y, n) => { if (y[1] < 10 || n[1] < 10) return ['~', 'pas assez de parties'];
    const p = (y[0] + n[0]) / (y[1] + n[1]), se = Math.sqrt(p * (1 - p) * (1 / y[1] + 1 / n[1])), z = se ? (y[0] / y[1] - n[0] / n[1]) / se : 0;
    return z > 1.96 ? ['✅', 'gagne plus'] : z < -1.96 ? ['❌', 'gagne moins'] : ['~', 'pas de différence nette']; };
  const help = (icon, label, pair, extra) => { const [y, n] = pair;
    if (!y[1]) return '<span class="chip" title="Jamais joué à 1900+ sur Arabia">' + icon + ' ' + label + ' : jamais</span>';
    const [v, words] = verdict(y, n), share = Math.round(100 * y[1] / (y[1] + n[1]));
    return '<span class="chip" title="' + esc(label + ' : ' + share + ' % des joueurs, gagnent ' + range(y) + ' ; sans : ' + range(n) + ' — ' + words + (extra || '')) + '">'
      + icon + ' ' + label + ' <b>' + v + '</b> <span class="mut">' + share + ' % · ' + winNum(y) + ' vs ' + winNum(n) + '</span></span>'; };
  const helps = d => '<div class="chips">' + help('⏱', 'Castle avant 20:00', d.castle20, '. Attention : celui qui est derrière passe Castle plus tard.')

  // Plans réels par civ (notes/tools/plans_civs.py → notes/civs/plans.json, S139) : HTML déjà échappé par le

  const PLAN_LEG = '<div class="legend">Replays 1900+ Arabia. Bleu = combien c\'est joué · vert = gagne ≥ 50 % · rouge = gagne moins. Corrélations, pas causes.</div>';
  function planBlock(c, title) {

  }
  // Matchup sans fiche rédigée : ce que font les joueurs 1900+ de chaque civ (replays), et le face-à-face.
  function autoMatchup(m, t) {

      + '<div class="legend">Top 3 par phase : % des joueurs qui le jouent · % de victoires, toutes parties de la civ (pas seulement ce matchup)</div>';
  }

  // Pros (replays/pros.py) : leurs parties RM 1v1 Arabia contre l'ensemble des 1900+.
  const PROS = (STATS && STATS.pros && STATS.pros.pros) || {};

  function proPage(n) {

      + '<span class="mut">de victoires · ' + p.all[1] + ' parties RM 1v1 Arabia lues (' + esc(p.from) + ' → ' + esc(p.to) + '), Elo ' + p.elo[0] + '–' + p.elo[1] + '</span></div>'
      + '<h4>Clics médians (lui · 1900+)</h4><p>' + p.clicks.map((c, i) => AGE[i] + ' ' + vs(c[0], c[1])).join(' · ') + '</p>'
      + '<h4>Ouvertures</h4><ul>' + p.openings.map(o => '<li>' + esc(nm(o[0])) + ' — ' + Math.round(100 * o[1][1] / p.all[1]) + ' % de ses parties (1900+ : ' + o[3]
        + ' %), gagne ' + range(o[1]) + ', clic Castle ' + esc(o[2]) + '</li>').join('') + '</ul>'
      + '<h4>Armée en Castle (' + p.castleN + ' parties) : part des ressources, lui · 1900+</h4><ul>'
        + p.army.map(a => '<li>' + esc(nm(a[0], true)) + ' — ' + vs(a[1] + ' %', a[2] + ' %') + '</li>').join('') + '</ul>'

  function civPage(c) {

  // un des comptes du joueur est en 1v1. Si oui : bandeau, puis la fiche du matchup, sinon la page
  // de la civ adverse, une seule fois par partie pour ne pas reprendre la main au joueur.
  let shownMatch = null, testUntil = 0;
  const clock = () => new Date().toLocaleTimeString('fr-FR');
  // Affiche une partie en cours : bandeau, puis le matchup (fiche rédigée ou vue auto), une fois par partie.
  let banner = null; // 'live' | 'test' | 'last' : la détection n'efface que son propre bandeau
  const mins = m => m.finished ? Math.round((Date.parse(m.finished) - Date.parse(m.started)) / 60000) + ' min' : '';
  function showMatch(m, kind) {
    const test = kind === 'test', last = kind === 'last';
    const players = m ? m.teams.flatMap(t => t.players) : [];
    const me = players.find(p => ME.includes(p.profileId)), him = players.find(p => !ME.includes(p.profileId));
    if (!m || players.length !== 2 || !me || !him) {
      if (banner !== 'last') { $('live').hidden = true; banner = null; }
      return false;
    }
    banner = kind; $('live').hidden = false;
    $('live').innerHTML = (test ? '🧪 <b>TEST</b> · ' : '')
      + (last ? '⏮ <b>Dernière partie</b> (' + esc(me.name) + ') : ' + (me.won ? '✅ gagnée' : me.won === false ? '❌ perdue' : '?') + ' · ' : '🔴 <b>En partie</b> : ')
      + esc(me.civName || '?') + ' contre ' + esc(him.civName || '?')
      + ' — ' + esc(him.name) + (him.rating ? ' (' + him.rating + ')' : '') + ' · ' + esc(m.mapName || '')
      + (last ? ' · ' + mins(m) + (me.ratingDiff ? ' · ' + (me.ratingDiff > 0 ? '+' : '') + me.ratingDiff + ' Elo' : '')
        + ' · <a href="https://www.aoe2insights.com/match/' + m.matchId + '/" target="_blank" rel="noopener">replay sur AoE2 Insights</a>'
        + ' · <a href="#" id="closeLast">✕</a>' : '');
    if (last) $('closeLast').onclick = e => { e.preventDefault(); $('live').hidden = true; banner = null; };
    if (shownMatch === m.matchId) return true;
    shownMatch = m.matchId;
    if (civs.includes(me.civName) && civs.includes(him.civName)) {
      $('mine').value = me.civName; $('theirs').value = him.civName; history.replaceState(null, '', '#'); route();
    }
    return true;
  }
  async function live() {
    if (document.hidden || !ME.length || Date.now() < testUntil) return;
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=3&profile_ids=' + ME.join(','));
      if (!r.ok) { $('liveStatus').textContent = clock() + ' · API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => !x.finished && Date.now() - Date.parse(x.started) < 3 * 3600e3);
      $('liveStatus').textContent = clock() + ' · ' + (showMatch(m, 'live') ? 'en partie' : 'pas en partie');
    } catch (e) { $('liveStatus').textContent = clock() + ' · réseau indisponible'; }
  }
  // 🧪 : une fausse partie (ta civ = « Ma civ », adversaire au hasard) passe par le même chemin
  // qu'une vraie ; la détection reprend 60 s plus tard.
  $('test').onclick = () => {
    const pick = () => civs[Math.floor(Math.random() * civs.length)];
    const mine = civs.includes($('mine').value) ? $('mine').value : pick();
    let theirs = pick(); while (theirs === mine && civs.length > 1) theirs = pick();
    testUntil = Date.now() + 60000;
    showMatch({ matchId: 'test-' + Date.now(), mapName: 'Arabia', teams: [
      { players: [{ profileId: ME[0], name: 'MoP', civName: mine }] },
      { players: [{ profileId: -1, name: 'Adversaire test', civName: theirs, rating: 1900 }] }] }, 'test');
    $('liveStatus').textContent = 'test : détection en pause 60 s';
  };
  // ⏮ : la dernière partie terminée du compte choisi (ou de tous), même bandeau et même matchup.
  try { $('acct').value = localStorage.getItem('acct') || ''; } catch (e) {}
  $('acct').onchange = () => { try { localStorage.setItem('acct', $('acct').value); } catch (e) {} };
  $('last').onclick = async () => {
    const ids = $('acct').value ? [$('acct').value] : ME;
    $('liveStatus').textContent = 'recherche de la dernière partie…';
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=10&profile_ids=' + ids.join(','));
      if (!r.ok) { $('liveStatus').textContent = 'API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => x.finished && x.teams.flatMap(t => t.players).length === 2);
      shownMatch = null;
      if (!m) { $('liveStatus').textContent = 'aucune partie 1v1 récente'; return; }
      showMatch(m, 'last');
      $('liveStatus').textContent = new Date(m.finished).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    } catch (e) { $('liveStatus').textContent = 'réseau indisponible'; }
  };
  live();
  setInterval(live, 10000);
  document.addEventListener('visibilitychange', live);
})();
</script>
</html>
