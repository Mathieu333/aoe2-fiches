  const AGE = { 2: 'FÉODAL', 3: 'CASTLE', 4: 'IMPÉRIAL' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  // « ? » en fin de ligne : le pourquoi se déplie au clic, au lieu d'une ligne de plus par conseil.
  const why = t => '<details class="w"><summary title="Pourquoi ?"></summary><div class="why">' + esc(t) + '</div></details>';
  const more = (label, html) => '<details class="more"><summary data-l="' + esc(label) + '"></summary>' + html + '</details>';
  const item = i => '<li>' + esc(i.action) + why(i.why) + '</li>';
  const civs = [...new Set(CARDS.flatMap(e => [e.card.mine, e.card.theirs]))].sort();
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  for (const id of ['mine', 'theirs']) $(id).innerHTML = civs.map(c => '<option>' + esc(c) + '</option>').join('');

  function show() {
    const m = $('mine').value, t = $('theirs').value;
    const e = CARDS.find(x => x.card.mine === m && x.card.theirs === t);
    history.replaceState(null, '', '#' + slug(m) + '--' + slug(t));
    if (!e) { $('view').innerHTML = '<div class="empty">Aucune fiche préparée pour ' + esc(m) + ' → ' + esc(t) + '.</div>'; return; }
    const c = e.card;
    // Lisible en 4 s : le plan, puis par âge l'objectif et quoi faire. Le reste se déplie.
    $('view').innerHTML = '<div class="ttl"><b>' + esc(c.mine) + ' → ' + esc(c.theirs) + '</b>'
      + (e.status === 'validated' ? '' : '<span class="draft" title="Pas encore validée par le joueur">BROUILLON</span>') + '</div>'
      + '<div class="gp">' + esc(c.gamePlan.action) + why(c.gamePlan.why) + '</div>'
      + more('Son plan', '<p class="their">' + esc(c.theirPlan.action) + '</p>')
      + '<div class="cols" style="margin-top:16px">' + c.phases.map(p => '<section class="a' + p.age + '"><div class="age-hd"><div class="an">' + AGE[p.age] + '</div><div class="goal">🎯 ' + esc(p.goal) + '</div></div>'
        + '<ul>' + p.do.map(item).join('') + '</ul>'
        + (p.ifSee.length ? more('🔀 Si tu vois… (' + p.ifSee.length + ')', p.ifSee.map(b => '<div class="si"><div class="tr">' + esc(b.trigger) + '</div><div>' + esc(b.action) + '</div>' + why(b.why) + '</div>').join('')) : '')
        + (p.watch.length ? more('⚠ Attention (' + p.watch.length + ')', '<div class="att"><ul>' + p.watch.map(item).join('') + '</ul></div>') : '') + '</section>').join('') + '</div>'
      + (c.uncertainties.length ? more('À valider (' + c.uncertainties.length + ')', '<ul>' + c.uncertainties.map(u => '<li>' + esc(u) + '</li>').join('') + '</ul>') : '')
      + '<footer>' + esc(e.version) + ' · ' + esc(e.createdAt) + ' · données ' + esc(e.dataVersion) + '</footer>';
  }
  // Civ pages: what 1900+ players do on Arabia, measured on their replays.
  const pct = t => Math.round(100 * t[0] / t[1]);
  // « 69 % (entre 57 et 81 %) » : la fourchette à 95 %, plus lisible que « ±12 ».
  const range = t => { const [w, n] = t; if (n < 10) return w + ' sur ' + n;
    const p = w / n, e = 1.96 * Math.sqrt(p * (1 - p) / n);
    return Math.round(100 * p) + ' % (entre ' + Math.max(0, Math.round(100 * (p - e))) + ' et ' + Math.min(100, Math.round(100 * (p + e))) + ' %)'; };
  const civNames = STATS ? Object.keys(STATS.civs) : [];
  // Noms courts pour la lecture rapide ; le nom complet reste au survol.
  const SHORT = { 'Scout/cav. légère': 'Scouts', 'Archer/arbalète': 'Archers', 'Tirailleur': 'Tirailleurs', 'M@A/épée': 'M@A',
    'FC sans armée': 'FC direct', 'Cav. archer': 'Cav. archers', 'Knight': 'Knights', 'Mangonel': 'Mangonels', 'Scorpion': 'Scorpions',
    'Bélier': 'Béliers', 'Chameau': 'Chameaux', 'Eagle': 'Eagles' };
  const nm = (s, castle) => String(s).split(' + ').map(p => p === 'Lancier/piquier' ? (castle ? 'Piquiers' : 'Lanciers')
    : (SHORT[p] || p.replace(/ (Cavalry|Raider|Warrior|Archer)$/, ''))).join(' + ');
  // Couleur seulement quand la fourchette à 95 % ne contient pas 50 % : sinon, c'est du bruit.
  const tone = t => { const [w, n] = t; if (n < 10) return 'flat'; const p = w / n, e = 1.96 * Math.sqrt(p * (1 - p) / n);
    return p - e > 0.5 ? 'good' : p + e < 0.5 ? 'bad' : 'flat'; };
  const winNum = t => '<span class="' + tone(t) + '">' + (t[1] < 10 ? t[0] + '/' + t[1] : pct(t) + ' %') + '</span>';
  const tip = (full, t, extra) => esc(full + ' — ' + t[1] + ' parties, gagne ' + range(t) + (extra || ''));
  // Une ligne = nom · barre (part des parties) · % de victoires. Détail au survol.
  const bars = (rows, total, castle) => '<div class="bars">' + rows.map(([label, t, extra]) =>
    '<div class="bar" title="' + tip(label, t, extra) + '"><span class="lbl">' + esc(nm(label, castle)) + '</span>'
    + '<span class="track"><span class="fill" style="display:block;width:' + Math.round(100 * t[1] / total) + '%"></span></span>'
    + '<span class="v">' + winNum(t) + '</span></div>').join('') + '</div>';
  const top = rows => { const big = rows.filter(r => r[1][1] >= 10); return (big.length ? big : rows).slice(0, 4); };
  const leadText = l => esc(l[0].replace(/ ≥ 20 % en Castle$/, ' en Castle').replace(/^ouverture /, 'Ouverture ')
    .replace(/^(Ouverture )?(.+?)( en Castle)?$/, (m, a, u, b) => (a || '') + nm(u, !!b) + (b || '')));
  const CAVEAT = STATS ? '<p class="note">Replays ' + esc(STATS.scope) + ', relus le ' + esc(STATS.builtAt) + '. '
    + '<b>Barre</b> = part des parties ; <b>chiffre</b> = % de victoires, en couleur seulement si l\'écart à 50 % dépasse la marge d\'erreur. '
    + 'Ouverture = première unité produite à 3 exemplaires (M@A = milices avant l\'arrivée en Féodal). Castle = unités ≥ 20 % des ressources militaires. '
    + 'Corrélations, pas causes. <b>Pistes, pas preuves</b> : ' + STATS.leads + ' écarts sur ' + STATS.tests + ' comparaisons passent le seuil, ~'
    + Math.round(STATS.tests * 0.05) + ' attendus par hasard.</p>' : '';
  function overview() {
    const rows = civNames.map(c => [c, STATS.civs[c]]).sort((a, b) => pct(b[1].all) - pct(a[1].all));
    $('view').innerHTML = '<table class="civs"><tr><th>Civ</th><th>Victoires</th><th>Ouvre surtout</th></tr>'
      + rows.map(([c, d]) => '<tr title="' + tip(c, d.all) + '"><td><a href="#civ/' + slug(c) + '">' + esc(c) + '</a></td><td><b>' + winNum(d.all) + '</b></td><td>'
        + (d.openings[0] ? esc(nm(d.openings[0][0])) : '-') + '</td></tr>').join('') + '</table>'
      + more('Comment lire', CAVEAT);
  }
  function civPage(c) {
    const d = STATS.civs[c], lead = d.leads[0];
    const sign = l => pct(l[1]) > pct(l[2]) ? '<span class="up">▲</span> ' : '<span class="dn">▼</span> ';
    const leadLine = l => '<div class="lead" title="' + esc(l[0] + ' — avec : ' + range(l[1]) + ', sans : ' + range(l[2])) + '">' + sign(l)
      + '<b>' + leadText(l) + '</b> : ' + winNum(l[1]) + ' contre ' + winNum(l[2]) + '</div>';
    const col = (age, title, rows, total, castle) => '<section class="a' + age + '"><div class="age-hd"><div class="an">' + title + '</div></div>'
      + bars(top(rows), total, castle) + '</section>';
    const list = (rows, castle) => '<ul>' + rows.map(([l, t, x]) => '<li>' + esc(nm(l, castle)) + ' — ' + range(t) + ' · ' + t[1] + ' parties' + (x || '') + '</li>').join('') + '</ul>';
    $('view').innerHTML = '<div class="hero"><b>' + esc(c) + '</b><span class="big ' + tone(d.all) + '">' + pct(d.all) + ' %</span>'
      + '<span class="mut">de victoires · ' + d.all[1] + ' parties 1900+ Arabia</span></div>'
      + (lead ? leadLine(lead) : '')
      + '<div class="cols">'
      + col(2, 'OUVERTURE', d.openings.map(o => [o[0], o[1], ', clic Castle ' + o[2]]), d.all[1], false)
      + col(3, 'CASTLE', d.castle, d.castleN, true)
      + col(4, 'IMPÉRIAL', d.imperial, d.impN, true) + '</div>'
      + '<div class="legend">barre = part des parties · chiffre = % de victoires (vert/rouge = au-delà de la marge d\'erreur)</div>'
      + more('Détails', (d.leads.length > 1 ? '<h4>Autres pistes</h4>' + d.leads.slice(1).map(leadLine).join('') : '')
        + '<h4>Clics médians</h4><p>Féodal ' + esc(d.clicks[0]) + ' · Castle ' + esc(d.clicks[1]) + ' · Impérial ' + esc(d.clicks[2])
          + ' (gagnants ' + esc(d.impClick[0]) + ', perdants ' + esc(d.impClick[1]) + ')</p>'
        + '<h4>Toutes les ouvertures</h4>' + list(d.openings.map(o => [o[0], o[1], ' · clic Castle ' + esc(o[2])]), false)
        + '<h4>Toutes les compositions Castle</h4>' + list(d.castle, true)
        + '<h4>Unité par unité en Castle : ≥ 20 % de l\'armée, contre sans</h4><ul>'
          + d.units.map(u => '<li>' + esc(nm(u[0], true)) + ' — ' + range(u[1]) + ' contre ' + range(u[2]) + '</li>').join('') + '</ul>'
        + '<h4>Toutes les compositions Impérial</h4>' + list(d.imperial, true)
        + '<h4>Techs prises en Castle</h4><table><tr><th>Tech</th><th>Joueurs</th><th>Gagnants</th><th>Perdants</th></tr>'
          + d.techs.map(t => '<tr><td>' + esc(t[0]) + '</td><td>' + t[1] + ' %</td><td>' + t[2] + ' %</td><td>' + t[3] + ' %</td></tr>').join('') + '</table>'
        + CAVEAT);
  }

  const [hm, ht] = location.hash.slice(1).split('--');
  const first = CARDS[0];
  $('mine').value = civs.find(c => slug(c) === hm) || (first && first.card.mine) || civs[0];
  $('theirs').value = civs.find(c => slug(c) === ht) || (first && first.card.theirs) || civs[0];
  $('civ').innerHTML = '<option value="">Toutes les civs</option>' + civNames.map(c => '<option>' + esc(c) + '</option>').join('');
  function route() {
    const civTab = !!STATS && location.hash.startsWith('#civ');
    $('tabM').className = civTab ? '' : 'on'; $('tabC').className = civTab ? 'on' : '';
    $('ctlM').hidden = civTab; $('ctlC').hidden = !civTab; $('tabC').hidden = !STATS;
    if (!civTab) {
      if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
      return;
    }
    const c = civNames.find(n => '#civ/' + slug(n) === location.hash);
    $('civ').value = c || '';
    if (c) civPage(c); else overview();
  }
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  $('civ').onchange = () => { location.hash = $('civ').value ? 'civ/' + slug($('civ').value) : 'civ'; };
  $('tabM').onclick = () => { history.replaceState(null, '', '#'); route(); };
  $('tabC').onclick = () => { location.hash = 'civ'; };
  window.addEventListener('hashchange', route);
  route();
})();
