<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches de matchup AoE2</title>
<style>
  :root { --bg: #10151d; --panel: #18202c; --ink: #e8edf3; --mut: #9aa6b4; --line: #2a3443;
    --f: #d99a2b; --c: #4a95e6; --i: #a070e6; --warn-bg: #3a2c10; --warn-ink: #f0c060; --acc: #4a95e6; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6f9; --panel: #fff; --ink: #17202c; --mut: #5f6b7a;
    --line: #dde2e8; --warn-bg: #fff4dc; --warn-ink: #8a5300; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 40px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 18px; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  label { font-size: 13px; color: var(--mut); display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  .draft { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 2px 8px; }
  .ttl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .ttl b { font-size: 22px; }
  .gp { font-size: 17px; font-weight: 600; margin: 10px 0 2px; }
  .their { color: var(--mut); margin: 8px 0 18px; } .their b { color: var(--ink); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .a2 { --age: var(--f); } .a3 { --age: var(--c); } .a4 { --age: var(--i); }
  .age-hd { border-top: 5px solid var(--age); padding-top: 8px; }
  .an { font-weight: 800; letter-spacing: .06em; color: var(--age); font-size: 13px; }
  .goal { font-weight: 600; margin-top: 2px; }
  h4 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--mut); }
  ul { margin: 0; padding-left: 18px; } li { margin: 4px 0; }
  .si { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--age); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .si .tr { font-weight: 700; } .si .tr::before { content: "SI "; color: var(--age); }
  .att { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  details { margin-top: 2px; } summary { cursor: pointer; color: var(--mut); font-size: 12.5px; list-style: none; }
  summary::-webkit-details-marker { display: none; } summary::before { content: "▸ pourquoi"; } details[open] summary::before { content: "▾ pourquoi"; }
  .why { color: var(--mut); font-size: 13.5px; }
  .att .why { color: inherit; opacity: .8; }
  .empty { padding: 40px 0; color: var(--mut); font-size: 16px; }
  footer { margin-top: 28px; color: var(--mut); font-size: 12.5px; }
</style>
<div class="wrap">
  <header>
    <h1>Fiches de matchup AoE2 · 1v1</h1>
    <label>Ma civ <select id="mine"></select></label>
    <button id="swap" title="Inverser">⇄</button>
    <label>Sa civ <select id="theirs"></select></label>
  </header>
  <main id="view"></main>
  <footer>Fiches rédigées à l'avance ; rien à saisir en partie. Un brouillon n'est pas encore validé par le joueur. Mise à jour : 2026-10-31.</footer>
</div>
<script>
(() => {
  const CARDS = [{"key":"shu::franks","version":"shu-franks-v3","status":"draft","createdAt":"2026-10-31","dataVersion":"4b3d7155ad33","card":{"mine":"Shu","theirs":"Franks","gamePlan":{"action":"Boom derrière une masse d'archers qui ne meurt pas → château défensif au-dessus de tes fermes → Imp avant lui avec Bracer + Chemistry → push Arbalètes + Halbs/White Feather Guards + Traction Trebuchets avant que Paladin + BBC prennent le dessus.","why":"Shu garde ses archers toute la partie (technologies d'archerie -25 %) et les Francs n'ont ni Arbalète, ni Bracer, ni Thumb Ring : la guerre à distance est à toi. Une civ archer ne dicte pas et meurt en late sur map ouverte : elle gagne sur un timing (INIT1, IMP2). Boom + château défensif = choix du joueur (S77).","sources":["manual","S77","tree:Shu","tree:Franks","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":492,"age":4},{"civ":"Shu","kind":"Unit","id":359,"age":4},{"civ":"Shu","kind":"Unit","id":1959,"age":4},{"civ":"Shu","kind":"Unit","id":1942,"age":4},{"civ":"Shu","kind":"Tech","id":201,"age":4},{"civ":"Shu","kind":"Tech","id":47,"age":4},{"civ":"Shu","kind":"Building","id":82,"age":3}]},"theirPlan":{"action":"Scouts (+20 % PV dès le Féodal) → le moins de tirailleurs possible + Light Cav + 2-3 chevaliers → boom. Contre tes Xbow : 3 TC + scorpions + 1-2 mangonneaux, chevaliers en late Castle. Fin : Tirailleurs + Paladin + BBC.","why":"Profil Francs validé (D3b) et rail Paladin (S26) : rail dur, chevaliers seulement en Castle, nourriture + or lourds, peu de bois pour ses TC en début de Castle. Ses archers ne suivent pas les tiens.","sources":["manual","S26","tree:Franks","strings"],"assets":[{"civ":"Franks","kind":"Unit","id":448,"age":2},{"civ":"Franks","kind":"Unit","id":7,"age":2},{"civ":"Franks","kind":"Unit","id":546,"age":3},{"civ":"Franks","kind":"Unit","id":38,"age":3},{"civ":"Franks","kind":"Unit","id":279,"age":3},{"civ":"Franks","kind":"Unit","id":280,"age":3},{"civ":"Franks","kind":"Unit","id":569,"age":4},{"civ":"Franks","kind":"Unit","id":36,"age":4}]},"phases":[{"age":2,"goal":"Garder une masse d'archers intacte et fermer ton mur sans perdre de villageois face à ses scouts. Lui faire dépenser en tirailleurs pendant que tu prépares le boom.","do":[{"action":"BO archers à 19 vils. Pendant le up : un lancier en premier, protège les vils exposés.","why":"Contre une civ scouts, tout se joue sur son scout et tes premiers lanciers ; c'est lui qui a l'offensive au départ (AF6). 19 = défaut archer (OPEN2).","sources":["manual","S18"],"assets":[{"civ":"Shu","kind":"Building","id":87,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2},{"civ":"Shu","kind":"Unit","id":4,"age":2}]},{"action":"Poke pendant Fletching : 2 archers + 1 lancier + ton scout, sur ses baies.","why":"Version avec Fletching car Shu masse ses archers et paie ses technologies d'archerie -25 % (AF1, S23). Les Francs prennent les baies en premier (fourrageurs +15 %) : les toucher le force aux fermes et retarde sa range de tirailleurs (AF1b).","sources":["manual","S22","S23","tree:Shu","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":4,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2},{"civ":"Shu","kind":"Unit","id":448,"age":2},{"civ":"Shu","kind":"Tech","id":199,"age":2}]},{"action":"Pendant que tes archers traversent : 2 vils ferment le mur. Mur fini avant 13 min, ton or jamais accessible à ses unités.","why":"La fenêtre calme sert à tout préparer avant le micro (AF2, MACRO2).","sources":["manual","S18"],"assets":[{"civ":"Shu","kind":"Building","id":72,"age":2},{"civ":"Shu","kind":"Building","id":117,"age":2}]},{"action":"13 fermes pour le Castle. Mets des vils à la pierre dès le Féodal : le plan en demande 850 (2 TC + château), 975 avec une tour.","why":"13 fermes suffisent pour les ~800 de nourriture du Castle avec des archers (MACRO8). TC = 100 pierre, château = 650 (données). Un château se décide une phase avant : sans pierre au clic, il arrive trop tard (DEADLINE1).","sources":["manual","S49","S74","S77","tree:Shu"],"assets":[]}],"ifSee":[{"trigger":"ses tirailleurs campent devant ton mur, ton bois ou ton or","action":"Mur + tour : une Watch Tower sur la ressource visée, tes archers derrière le mur.","why":"Ses tirailleurs ne cassent pas les murs (2-3 dégâts, SF7) et la tour tire sur eux. Tes archers restent en vie pour Castle. Coût : 125 pierre prises sur le château.","sources":["manual","S14","S69","S77","tree:Shu","S78"],"assets":[{"civ":"Shu","kind":"Building","id":79,"age":2},{"civ":"Shu","kind":"Building","id":117,"age":2}]},{"trigger":"il a lâché ses scouts : ses tirailleurs sont seuls sur la carte","action":"3-4 scouts chassent ses tirailleurs ; tes archers restent derrière.","why":"Les scouts battent les tirailleurs (roue B). Seulement sans ses scouts (+20 % PV), qui battent les tiens (TR3). Ça coûte de la nourriture, pas d'or.","sources":["manual","S20","S77","strings","S78"],"assets":[{"civ":"Shu","kind":"Building","id":101,"age":2},{"civ":"Shu","kind":"Unit","id":448,"age":2}]},{"trigger":"il pousse tirailleurs + quelques scouts contre ta base","action":"Tes propres tirailleurs, en défense seulement, avec tes lanciers et sous ton TC. Garde l'or pour le château et le boom.","why":"Tirailleur = 25 nourriture / 35 bois, sans or : ton or reste pour le Castle (TR4). Jamais en avant : ses scouts mangent tes renforts (TR3).","sources":["manual","S77","tree:Shu","S78"],"assets":[{"civ":"Shu","kind":"Unit","id":7,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2}]},{"trigger":"une masse de scouts","action":"Mur complet sans trou au TC, lanciers, reste chez toi.","why":"Ses scouts +20 % PV défoncent les archers à découvert (AF6).","sources":["manual","S18","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":93,"age":2}]}],"watch":[{"action":"Ses tirailleurs ne veulent pas dire que ton ouverture a raté : c'est la réponse attendue. Ne prends jamais archers contre tirailleurs en terrain ouvert.","why":"Après scouts il va quasi toujours tirailleurs, faute d'or (S23). Ton gain : ta masse conservée et sa dépense en unités qui ne scalent pas (TR5).","sources":["manual","S23"],"assets":[]},{"action":"Plus aucun dégât possible (lui muré) : arrête les archers, mets tout en éco.","why":"L'armée sert à faire des dégâts (MACRO7).","sources":["manual","S16"],"assets":[]}]},{"age":3,"goal":"Boom à 3 TC derrière un écran Xbow + mangonneaux, château défensif au-dessus des fermes. Il est pauvre en début de Castle : il ne doit rien te prendre.","do":[{"action":"Crossbow + Bodkin, Thumb Ring dès que la masse tient. Boule toujours groupée.","why":"Ta masse est ton écran puis ton timing ; ces technologies coûtent -25 % pour Shu. Une boule de Xbow tient les chevaliers dans un passage étroit (B2).","sources":["manual","S56","tree:Shu","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":24,"age":3},{"civ":"Shu","kind":"Tech","id":200,"age":3},{"civ":"Shu","kind":"Tech","id":437,"age":3}]},{"action":"Atelier de siège : mangonneaux en défense.","why":"Le mangonneau déchire ses tirailleurs et ses scorpions (CA4, CA7). Tes engins vont plus vite (+10 %). Il n'a pas Redemption : ses moines ne convertissent pas ton siège.","sources":["manual","S18","S25","tree:Franks","strings"],"assets":[{"civ":"Shu","kind":"Building","id":49,"age":3},{"civ":"Shu","kind":"Unit","id":280,"age":3}]},{"action":"3 TC au total ; le 3e seulement quand ta défense tient.","why":"Plan du joueur : boom (S77). Un seul plan, payé en entier (MIX1). 3e TC quand la défense est assurée (TEMPO2).","sources":["manual","S74","S77"],"assets":[{"civ":"Shu","kind":"Building","id":109,"age":3}]},{"action":"Château dans ta base, au-dessus de tes fermes.","why":"Choix du joueur (S77). Contre une civ qui raide, le château couvre l'éco (CAST1), et il produit tes White Feather Guards.","sources":["manual","S75","S77"],"assets":[{"civ":"Shu","kind":"Building","id":82,"age":3}]},{"action":"Monastère : quelques moines contre ses premiers chevaliers et pour soigner.","why":"Piquiers et moines écrasent les chevaliers (B2). Shu n'a ni Sanctity, ni Block Printing, ni Redemption : moines en soutien, pas en pilier.","sources":["manual","S56","tree:Shu"],"assets":[{"civ":"Shu","kind":"Building","id":104,"age":3},{"civ":"Shu","kind":"Unit","id":125,"age":3}]}],"ifSee":[{"trigger":"des chevaliers","action":"Piquiers + White Feather Guards devant ta boule de Xbow, moines derrière. Tiens les passages étroits, ne traverse jamais en petits groupes.","why":"WFG = rôle de piquier (S77) : +8 vs cavalerie, 95 PV, 60 nourriture / 15 or. Chevaliers contre Xbow = situationnel (B2) : c'est à lui de venir.","sources":["manual","S56","S77","tree:Shu"],"assets":[{"civ":"Shu","kind":"Unit","id":358,"age":3},{"civ":"Shu","kind":"Unit","id":1959,"age":3},{"civ":"Shu","kind":"Unit","id":125,"age":3}]},{"trigger":"des scorpions ou des mangonneaux contre tes Xbow","action":"Tes mangonneaux visent son siège en premier ; combats près de ton château et de tes TC.","why":"C'est sa défense classique contre les Xbow (S26). Tes engins plus rapides l'atteignent ; tes Xbow ne restent pas groupés sous un mangonneau.","sources":["manual","S26","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":280,"age":3}]},{"trigger":"une masse de tirailleurs","action":"Mangonneaux + quelques Hei Guang pour les chasser. Jamais tirailleurs contre tirailleurs.","why":"Archer contre masse de tirailleurs = archer + mangonneau (CA7). Hei Guang (65 nourriture / 65 or, armure 4/3) dans le rôle des « quelques chevaliers » de CA4, validé par le joueur (S78).","sources":["manual","S18","S25","S78","tree:Shu"],"assets":[{"civ":"Shu","kind":"Unit","id":280,"age":3},{"civ":"Shu","kind":"Unit","id":1944,"age":3}]},{"trigger":"de la Light Cav qui raide tes fermes","action":"Piquiers à la maison, villageois dans les TC. Ta boule ne sort pas pour la chasser.","why":"L'éco couverte gagne le late (CAST1) ; une boule qui court après la cav est une boule qu'il contourne.","sources":["manual","S75"],"assets":[{"civ":"Shu","kind":"Unit","id":358,"age":3}]}],"watch":[{"action":"Pas de mélange 3 TC + siège offensif + château improvisé.","why":"Le prix du boom et de l'agression, le bénéfice d'aucun (MIX1, S73).","sources":["manual","S73"],"assets":[]},{"action":"Pas de Coiled Serpent Array en Castle.","why":"350 nourriture / 300 or : trop cher pour baser le Castle dessus (UT1).","sources":["manual","S70","tree:Shu"],"assets":[]},{"action":"Ses châteaux coûtent -15 % : surveille un château posé vers ta base en fin de Castle.","why":"Bonus franc ; un château adverse qui tire sur ton éco, plus ses trébuchets en Imp, est le piège à nier (CA9-trap).","sources":["manual","strings"],"assets":[]}]},{"age":4,"goal":"Passer Imp avant lui et frapper tout de suite. Gagner avant que Paladin, BBC et son éco ne prennent le dessus.","do":[{"action":"Bracer + Chemistry dès le clic, puis Arbalest.","why":"Timing archer (IMP2), moins cher pour Shu. Lui n'a ni Arbalète ni Bracer.","sources":["manual","tree:Shu","tree:Franks","strings"],"assets":[{"civ":"Shu","kind":"Tech","id":201,"age":4},{"civ":"Shu","kind":"Tech","id":47,"age":4},{"civ":"Shu","kind":"Unit","id":492,"age":4}]},{"action":"Halberdier, plus White Feather Guards depuis tes châteaux.","why":"Timing Halberdier contre sa cavalerie (IMP2) ; WFG = piquier lourd (S77).","sources":["manual","S77","tree:Shu"],"assets":[{"civ":"Shu","kind":"Unit","id":359,"age":4},{"civ":"Shu","kind":"Unit","id":1959,"age":4}]},{"action":"Traction Trebuchets dans l'armée : ils avancent avec elle, cassent ses châteaux et tirent plus loin que ses BBC (14 contre 12).","why":"Validé par le joueur : « ça bouge comme les BBC » (S77, S78) → reste dans le push même contre une civ knights (ATK1 nuancé). Données : portée 14, 175 bois / 210 or.","sources":["manual","S77","S78","tree:Shu","tree:Franks"],"assets":[{"civ":"Shu","kind":"Unit","id":1942,"age":4},{"civ":"Shu","kind":"Building","id":49,"age":4}]},{"action":"Au moins 3 reliques.","why":"Vos arbres s'équilibrent en fin de partie : les reliques font l'or du late (REL1).","sources":["manual","S41"],"assets":[{"civ":"Shu","kind":"Unit","id":125,"age":4}]},{"action":"Bolt Magazine seulement une fois l'éco installée.","why":"650 nourriture / 750 or, demande un château : un achat de late, pas un timing (UT1).","sources":["manual","S70","tree:Shu"],"assets":[{"civ":"Shu","kind":"Tech","id":1069,"age":4}]}],"ifSee":[{"trigger":"Cavalier + armure (son timing Imp)","action":"Halbs et WFG devant tes Arbalètes, moines derrière. Ne charge pas : laisse-le venir.","why":"C'est son timing cavalerie (IMP2). Contre des chevaliers, ça se joue au nombre, aux moines et aux upgrades (ATK1).","sources":["manual","S41"],"assets":[{"civ":"Shu","kind":"Unit","id":359,"age":4},{"civ":"Shu","kind":"Unit","id":1959,"age":4},{"civ":"Shu","kind":"Unit","id":125,"age":4}]},{"trigger":"des BBC","action":"Traction Trebuchets dessus : ils tirent à 14, ses BBC à 12. Tes Halbs restent devant contre sa cavalerie.","why":"Validé par le joueur (S78) ; portées des données. Le trébuchet bouge comme un BBC, il suit l'armée.","sources":["S78","tree:Shu","tree:Franks"],"assets":[{"civ":"Shu","kind":"Unit","id":1942,"age":4},{"civ":"Shu","kind":"Unit","id":359,"age":4}]},{"trigger":"il pose un château vers ta base","action":"Traction Trebuchets dessus tout de suite, ton armée devant eux.","why":"Ses châteaux coûtent -25 % en Imp ; un château qui tire sur ton éco te fait perdre la partie (CA9-trap).","sources":["manual","strings","S77"],"assets":[{"civ":"Shu","kind":"Unit","id":1942,"age":4}]}],"watch":[{"action":"Châteaux au-dessus de tes fermes, pas en avant.","why":"Il a de la cavalerie de raid : ton éco couverte gagne le late (CAST1).","sources":["manual","S75"],"assets":[]},{"action":"Si ton timing échoue, pas de deuxième push : stabilise, reliques, éco.","why":"Une civ archer meurt en late sur map ouverte (INIT1).","sources":["manual","S65"],"assets":[]}]}],"uncertainties":["Brouillon : le profil Shu n'a pas encore été relu avec toi. Pas de BO chiffré. War Chariot : rôle non évalué.","Données changées depuis septembre : les Francs ont Mounted Crossbowman, Cranequins et Ordonnance Companies, plus de Cavalier Archer. Rôle dans ce matchup non évalué."]}}];
  const AGE = { 2: 'FÉODAL', 3: 'CASTLE', 4: 'IMPÉRIAL' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  const why = t => '<details><summary></summary><div class="why">' + esc(t) + '</div></details>';
  const item = i => '<li>' + esc(i.action) + why(i.why) + '</li>';
  const civs = [...new Set(CARDS.flatMap(e => [e.card.mine, e.card.theirs]))].sort();
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  for (const id of ['mine', 'theirs']) $(id).innerHTML = civs.map(c => '<option>' + esc(c) + '</option>').join('');

  function show() {
    const m = $('mine').value, t = $('theirs').value;
    const e = CARDS.find(x => x.card.mine === m && x.card.theirs === t);
    history.replaceState(null, '', '#' + slug(m) + '--' + slug(t));
    if (!e) { $('view').innerHTML = '<div class="empty">Aucune fiche préparée pour ' + esc(m) + ' → ' + esc(t) + '.</div>'; return; }
    const c = e.card;
    $('view').innerHTML = '<div class="ttl"><b>' + esc(c.mine) + ' → ' + esc(c.theirs) + '</b>'
      + (e.status === 'validated' ? '' : '<span class="draft">BROUILLON — pas encore validée par le joueur</span>') + '</div>'
      + '<div class="gp">' + esc(c.gamePlan.action) + '</div>' + why(c.gamePlan.why)
      + '<p class="their"><b>Son plan :</b> ' + esc(c.theirPlan.action) + '</p>'
      + '<div class="cols">' + c.phases.map(p => '<section class="a' + p.age + '"><div class="age-hd"><div class="an">' + AGE[p.age] + '</div><div class="goal">🎯 ' + esc(p.goal) + '</div></div>'
        + '<h4>✅ Fais</h4><ul>' + p.do.map(item).join('') + '</ul>'
        + '<h4>🔀 Si tu vois…</h4>' + p.ifSee.map(b => '<div class="si"><div class="tr">' + esc(b.trigger) + '</div><div>' + esc(b.action) + '</div>' + why(b.why) + '</div>').join('')
        + (p.watch.length ? '<div class="att"><b>⚠ Attention</b><ul>' + p.watch.map(item).join('') + '</ul></div>' : '') + '</section>').join('') + '</div>'
      + (c.uncertainties.length ? '<h4>À valider</h4><ul>' + c.uncertainties.map(u => '<li>' + esc(u) + '</li>').join('') + '</ul>' : '')
      + '<footer>' + esc(e.version) + ' · ' + esc(e.createdAt) + ' · données ' + esc(e.dataVersion) + '</footer>';
  }
  const [hm, ht] = location.hash.slice(1).split('--');
  const first = CARDS[0];
  $('mine').value = civs.find(c => slug(c) === hm) || (first && first.card.mine) || civs[0];
  $('theirs').value = civs.find(c => slug(c) === ht) || (first && first.card.theirs) || civs[0];
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
})();
</script>
</html>
