ailleurs + quelques scouts contre ta base","action":"Tes propres tirailleurs, en défense seulement, avec tes lanciers et sous ton TC. Garde l'or pour le château et le boom.","why":"Tirailleur = 25 nourriture / 35 bois, sans or : ton or reste pour le Castle (TR4). Jamais en avant : ses scouts mangent tes renforts (TR3).","sources":["manual","S77","tree:Shu","S78"],"assets":[{"civ":"Shu","kind":"Unit","id":7,"age":2},{"civ":"Shu","kind":"Unit","id":93,"age":2}]},{"trigger":"une masse de scouts","action":"Mur complet sans trou au TC, lanciers, reste chez toi.","why":"Ses scouts +20 % PV défoncent les archers à découvert (AF6).","sources":["manual","S18","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":93,"age":2}]}],"watch":[{"action":"Ses tirailleurs ne veulent pas dire que ton ouverture a raté : c'est la réponse attendue. Ne prends jamais archers contre tirailleurs en terrain ouvert.","why":"Après scouts il va quasi toujours tirailleurs, faute d'or (S23). Ton gain : ta masse conservée et sa dépense en unités qui ne scalent pas (TR5).","sources":["manual","S23"],"assets":[]},{"action":"Plus aucun dégât possible (lui muré) : arrête les archers, mets tout en éco.","why":"L'armée sert à faire des dégâts (MACRO7).","sources":["manual","S16"],"assets":[]}]},{"age":3,"goal":"Boom à 3 TC derrière un écran Xbow + mangonneaux, château défensif au-dessus des fermes. Il est pauvre en début de Castle : il ne doit rien te prendre.","do":[{"action":"Crossbow + Bodkin, Thumb Ring dès que la masse tient. Boule toujours groupée.","why":"Ta masse est ton écran puis ton timing ; ces technologies coûtent -25 % pour Shu. Une boule de Xbow tient les chevaliers dans un passage étroit (B2).","sources":["manual","S56","tree:Shu","strings"],"assets":[{"civ":"Shu","kind":"Unit","id":24,"age":3},{"civ":"Shu","kind":"Tech","id":200,"age":3},{"civ":"Shu","kind":"Tech","id":437,"age":3}]},{"action":"Atelier de siège : mangonneaux en défense.","why":"Le mangonneau déchire ses tirailleurs et ses   // Mes parties (S98-S101) : les revues de review.py. Liste filtrable par badges ; page d'une partie =

  // Une seule échelle de temps pour la chronologie et le graphe : des minutes entières (TOTAL s).
  const AGES = ['Féodal', 'Castle', 'Impérial'];
  const span = g => g.orders[0].length * 60;

  const axis = g => { const n = g.orders[0].length; return '<div class="axis scrub">' + Array.from({ length: Math.floor(n / 5) + 1 }, (_, i) => '<span style="left:' + (i * 5 / n * 100) + '%">' + i * 5 + ' min</span>').join('') + '<i class="ph"></i></div>'; };
  const METRICS = { orders: ['Ordres aux unités', 'Ordres donnés aux unités par minute (clic droit, déplacement, stop) : en combat, ça mesure le micro.'],
    apm: ['APM', 'Actions par minute, doublons du client retirés.'],
    vills: ['Villageois', 'Villageois sortis à la fin de chaque minute, si la file avançait sans attendre la bouffe.'],

  let metric = 'orders', curT = null, playing = null, G = null;

  // de villageois entiers par ressource, sans upgrade puis avec chaque upgrade d'éco. Le palier
  // que le joueur avait est entouré. Nombre de bâtiments réglable, recherches cochables.
  const VIL = 'https://aoe2techtree.net/img/Unit/15.png';
  const GR = { f: 19.3, w: 23.4, g: 22.8 }, RNM = { f: 'nourriture', w: 'bois', g: 'or' }, RIMG = { f: 'food', w: 'wood', g: 'gold' };
  const STEPS = { f: [[213, 79, 1.1], [249, 42, 1.1]], w: [[202, 70, 1.2], [203, 71, 1.2]], g: [[55, 15, 1.15]] };
  const plans = [null, null];
  // Nourriture : répartie selon les vraies sources du joueur sur la période, chacune à sa vitesse.
  const FR = { fermes: [19.3, '🌾'], baies: [18.6, '🫐'], chasse: [24.6, '🦌'], 'bétail': [19.8, '🐑'] };
  function foodMix(P) { const mix = Object.entries(P.fmix || {}).filter(([k]) => FR[k]); if (!mix.length) mix.push(['fermes', 1]);
    const tot = mix.reduce((a, [, p]) => a + p, 0), mult = (P.ups.includes(213) ? 1.1 : 1) * (P.ups.includes(249) ? 1.1 : 1);
    return { mix, tot, rate: mix.reduce((a, [k, p]) => a + p * FR[k][0], 0) / tot * mult }; }
  function foodSplit(n, fm) { const raw = fm.mix.map(([k, p]) => [k, n * p / fm.tot]), out = raw.map(([k, x]) => [k, Math.floor(x)]);
    let left = n - out.reduce((a, [, x]) => a + x, 0);
    raw.map(([, x], i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { out[i][1]++; left--; } });
    return out.filter(([, x]) => x > 0); }
  function stepRates(r) { const out = [GR[r]]; STEPS[r].forEach(([, , k]) => out.push(out[out.length - 1] * k)); return out; }
  function haveStep(r, ups) { let i = 0; STEPS[r].forEach(([id], j) => { if (ups.includes(id)) i = j + 1; }); return i; }
  function planBox(g, side) {
    const e = g.eco[side]; if (!e || !e.plan || !e.plan.calc) return '';
    const P = e.plan, mins = P.mins || 6, st = plans[side];
    // Regroupe les bâtiments identiques (même type, même unité) : une ligne avec un compteur.
    const rows = [];
    P.calc.forEach(it => { const k = it.once ? null : it.t + '|' + it.u, row = k && rows.find(x => x.key === k);
      if (row) row.n++; else rows.push(Object.assign({ key: k, n: 1 }, it)); });
    rows.forEach((row, i) => { if (st.n[i] == null) st.n[i] = row.once ? 1 : row.n; });
    const per = row => { const o = {}; Object.entries(row.c).forEach(([r, x]) => { if (x && GR[r]) o[r] = x * st.n[rows.indexOf(row)] / (row.once ? (row.m || mins) : 1); }); return o; };
    const cnt = (x, rate, once) => once ? Math.max(1, Math.round(x / rate)) : Math.ceil(x / rate - 0.05);
    const tech = (pic, cls) => pic != null ? '<img class="pt' + (cls || '') + '" src="' + IMG('Tech', pic) + '" alt="">' : '';
    const fm = foodMix(P);
    const ladder = (r, x, once) => { if (r === 'f') { const n = cnt(x, fm.rate, once);
        return '<span class="pr" title="Réparti comme ta nourriture sur la période : ' + fm.mix.map(([k, p]) => k + ' ' + p).join(', ') + ' villageois en moyenne"><img class="pres" src="https://aoe2techtree.net/img/food.png" alt="nourriture"><b>' + n + '</b>'
          + (fm.mix.length > 1 || fm.mix[0][0] !== 'fermes' ? '<span class="mut">(' + foodSplit(n, fm).map(([k, v]) => FR[k][1] + v).join(' ') + ')</span>' : '') + '</span>'; }
      const rates = stepRates(r), have = haveStep(r, P.ups);
      return '<span class="pr"><img class="pres" src="https://aoe2techtree.net/img/' + RIMG[r] + '.png" alt="' + RNM[r] + '">'
        + rates.map((rt, j) => '<span class="ps' + (j === have ? ' on' : '') + '" title="' + (j ? 'avec ' + STEPS[r].slice(0, j).map(s => s[0] === 202 ? 'Double-Bit Axe' : s[0] === 203 ? 'Bow Saw' : s[0] === 55 ? 'Gold Mining' : s[0] === 213 ? 'Wheelbarrow' : 'Hand Cart').join(' + ') : 'sans upgrade') + (j === have ? ' (ce que tu avais)' : '') + '">'
          + (j ? tech(STEPS[r][j - 1][1]) : '') + '<b>' + cnt(x, rt, once) + '</b></span>').join('') + '</span>'; };
    const costTxt = c => Object.entries(c).filter(([, x]) => x).map(([r, x]) => x + ' ' + (RNM[r] || r)).join(' + ');
    const line = (row, i) => { const v = per(row), off = !st.n[i];
      const icon = row.img && row.img[1] != null ? '<img class="pu" src="' + IMG(row.img[0], row.img[1]) + '" alt="">' : '<span class="pu">🔧</span>';
      const ctl = row.once ? '<input type="checkbox" data-pp="' + side + ',' + i + ',t"' + (off ? '' : ' checked') + '>'
        : '<span class="pn"><button data-pp="' + side + ',' + i + ',-1">−</button><b>' + st.n[i] + '</b><button data-pp="' + side + ',' + i + ',1">+</button></span>';
      const what = row.once ? esc(row.t) + '<span class="mut"> · ' + costTxt(row.c) + (row.m ? ', idéal ' + mmss(row.at * 1000) + ' (toi ' + mmss(row.real * 1000) + ') → payé en ' + row.m + ' min depuis le clic Castle' : ', sur ' + mins + ' min') + '</span>'
        : esc(row.u) + '<span class="mut"> · ' + costTxt(row.uc || {}) + ' / ' + row.ut + ' s' + (row.pct != null ? ' · occupé ' + row.pct + ' %' : '') + '</span>';
      return '<div class="pl2' + (off ? ' off' : '') + '">' + ctl + icon + '<span class="pw">' + what + '</span>'
        + '<span class="pls">' + ['f', 'w', 'g'].filter(r => v[r]).map(r => ladder(r, v[r], row.once)).join('') + '</span></div>'; };
    const units = rows.map((row, i) => row.once ? '' : line(row, i)).join(''), once = rows.map((row, i) => row.once ? line(row, i) : '').join('');
    // Total au palier d'upgrades que le joueur avait, contre ses villageois réels.
    const tot = { f: 0, w: 0, g: 0 };
    rows.forEach(row => Object.entries(per(row)).forEach(([r, x]) => tot[r] += x / (r === 'f' ? fm.rate : stepRates(r)[haveStep(r, P.ups)])));
    const need = Object.fromEntries(Object.entries(tot).map(([r, x]) => [r, Math.ceil(x - 0.05)])), had = Object.fromEntries(['f', 'w', 'g'].map(r => [r, Math.round(P.had[r] || 0)]));
    const sum = o => o.f + o.w + o.g, gap = sum(need) - sum(had);
    const res = (o, cmp) => ['f', 'w', 'g'].map(r => '<span class="pr"><img class="pres" src="https://aoe2techtree.net/img/' + RIMG[r] + '.png" alt="' + RNM[r] + '"><b' + (cmp && o[r] > cmp[r] ? ' class="bad"' : '') + '>' + o[r] + '</b></span>').join('');
    const timing = P.timing.map(([t, b, k, have, nd]) => '<span class="ptm" title="' + mmss(t * 1000) + ' : ' + have + ' villageois au total ; il en faut ≈ ' + nd + ' pour faire tourner tout ce qui était posé (TC compris).">'
      + '<img class="pt" src="' + IMG('Building', g.buildingIcons[b]) + '" alt="">' + (k > 1 ? k + 'e ' : '') + mmss(t * 1000) + ' · ' + have + '/' + nd + ' ' + (have >= nd ? '<span class="good">✓</span>' : '<span class="bad">✗</span>') + '</span>').join('');

  function seek(s) {
    if (!G) return;
    curT = Math.max(0, Math.min(Math.floor(G.game_ms / 1000), Math.round(s)));
    if ($('map')) drawMap(G);
    $('snapbox').innerHTML = snapshot(G); wireSnap();
    document.querySelectorAll('.ph').forEach(p => p.style.left = pc(G, curT));
  }
  function wireSnap() { document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => seek(+b.dataset.jump)); }
  // Bulletin (S112) : plan / macro / TC / micro, ta fenêtre de réaction, ce qu'il fallait couper, la pierre.
  function verdictBox(g) {
    const V = g.verdict; if (!V || !V.card) return '';
    const ST = { ok: ['✓', 'good'], ko: ['✗', 'bad'], mid: ['≈', 'warn'], '?': ['?', 'mut'] }, T = x => mmss(x * 1000);
    const card = (k, l) => { const [s, t] = V.card[k], [ic, cl] = ST[s] || ST['?'];
      return '<div class="vc"><h5>' + l + '</h5><b class="' + cl + '">' + ic + '</b><small>' + esc(t) + '</small></div>'; };
    const w = V.window, okw = w && ((w.mango && w.mango - w.es <= 90) || (w.tc && w.tc - w.es <= 120));
    const win = w ? '<div class="vwin"><div><b style="color:' + ME_C + '">Ta pression</b><span>Crossbow ' + T(w.press) + (w.ranges > 1 ? ' · ' + w.ranges + ' ranges' : '') + '</span></div><em>→</em>'
      + '<div><b style="color:' + HIM_C + '">Il s’engage</b><span>' + (w.gold != null ? '≈ ' + w.gold + ' vill. à l’or · ' : '') + 'Elite Skirm ' + T(w.es)
      + (w.armor.length ? ' · ' + w.armor.map(a => a[0]).join(' + ') : '') + '</span></div><em>→</em>'
      + '<div><b>Ta fenêtre : ' + T(w.es) + '</b><span class="' + (okw ? 'good' : 'bad') + '">Mango ' + (w.mango ? T(w.mango) : 'jamais') + ' · TC ' + (w.tc ? T(w.tc) : 'jamais') + '</span><span class="mut">CA7, CA3</span></div></div>' : '';
    const cut = V.cut && V.cut.length ? '<div class="vcut"><h5>Ce qu’il fallait couper</h5>' + V.cut.map(([n, t, why]) => '<div><s>' + esc(n) + ' ' + T(t) + '</s> <span class="mut">' + esc(why) + '</span></div>').join('') + '</div>' : '';
    const st = V.stone ? '<div class="vstone">⚠ Ta pierre est avancée, du côté de l’adversaire (' + V.stone.me + ' cases de ton TC) : un TC sur pierre y était exposé. <span class="mut">⚠ sur la carte.</span></div>' : '';
    return '<div class="vcard">' + card('plan', 'Plan') + card('macro', 'Macro') + card('tc', 'TC') + card('micro', 'Micro') + '</div>' + win + cut + st;
  }
  const chOpt = Object.assign({ prod: true, apm: false, idle: true }, (() => { try { return JSON.parse(store('chopt') || '{}'); } catch (e) { return {}; } })());
  document.addEventListener('change', ev => { const k = ev.target.dataset && ev.target.dataset.co; if (!k || !G) return;
    chOpt[k] = ev.target.checked; store('chopt', JSON.stringify(chOpt)); renderGame(); });
  const GTABS = [['chrono', 'Chronologie'], ['eco', 'Éco vs production'], ['details', 'Détails']];
  let gtab = GTABS.some(([k]) => k === store('gtab')) ? store('gtab') : 'chrono';
  function renderGame() {
    const g = G, both = civs.includes(g.mine) && civs.includes(g.vs);
    const ageRow = label => '<tr><td>' + label + '</td>' + ['me', 'him'].map(w => { const x = g.ages[w][label];
      return '<td>' + (x ? 'clic ' + mmss(x[0]) + ' → ' + mmss(x[1]) + ' · ' + x[2] + ' vill.' : '—') + '</td>'; }).join('') + '</tr>';
    const at = m => Math.min(m, g.spent[0].length) - 1;
    $('view').innerHTML = '<p><a href="#games">← Mes parties</a></p>'
      + '<div class="hero"><b>' + res(g) + ' ' + esc(g.mine) + ' vs ' + esc(g.vs) + '</b><span class="mut">' + day(g.started) + ' · ' + esc(g.map || '') + ' · ' + mmss(g.game_ms)
      + ' · ' + esc(g.account) + ' (' + g.rating + (g.ratingDiff ? ', ' + (g.ratingDiff > 0 ? '+' : '') + g.ratingDiff : '') + ') contre ' + esc(g.opp) + ' (' + (g.oppRating || '?') + ')'
      + ' · <a href="https://www.aoe2insights.com/match/' + g.match + '/" target="_blank" rel="noopener">AoE2 Insights</a>'
      + (both ? ' · <a href="#' + slug(g.mine) + '--' + slug(g.vs) + '">fiche du matchup</a>' : '') + '</span></div>'
      + (g.verdict && g.verdict.card ? verdictBox(g) + '<details class="allf"><summary>Toutes les alertes (' + g.flags.length + ')</summary><ul class="flags">' + g.flags.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></details>'
        : '<ul class="flags big">' + g.flags.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>')
      + '<div class="mapsnap"><div>' + mapView(g) + '</div><div id="snapbox"></div></div>'
      + '<div class="gtabs">' + GTABS.map(([k, l]) => '<button class="fchip' + (gtab === k ? ' on' : '') + '" data-gtab="' + k + '">' + l + '</button>').join('')
      + '<span class="mut">clique ou fais glisser une ligne pour choisir l\'instant</span></div>'
      + (gtab === 'chrono' ? chrono(g) : gtab === 'prod' ? chrono(g, 'prod') : gtab === 'eco' ? ecoBox(g) : gtab === 'graph' ? chart(g) : '<div class="details">' + '<h4>Âges</h4><table><tr><th></th><th>Toi</th><th>Lui</th></tr>' + AGES.map(ageRow).join('')
        + g.vills.map(([m, a, b]) => '<tr><td>Villageois à ' + m + ' min</td><td>' + a + '</td><td>' + b + '</td></tr>').join('') + '</table>'
        + '<h4>File du TC vide (≥ 8 s)</h4><p>' + (g.gaps.map(([a, b]) => mmss(a) + ' → ' + mmss(b) + ' (' + Math.round((b - a) / 1000) + ' s)').join(', ') || 'aucune') + '</p>'
        + '<h4>Ressources dépensées (cumul)</h4><table><tr><th>min</th><th>Toi</th><th>Lui</th></tr>'
        + [5, 10, 15, 20, 25, 30, 40].filter(m => m <= g.spent[0].length).map(m => '<tr><td>' + m + '</td><td>' + g.spent[0][at(m)] + '</td><td>' + g.spent[1][at(m)] + '</td></tr>').join('') + '</table>'
        + '<p class="note">Lu dans les ordres du replay : villageois et unités = mis en file (un villageois qui attend la bouffe ne se voit pas), ressources = dépensées au coût de base, morts invisibles. Vraies stats : écran de fin du jeu ou CaptureAge.</p></div>');
    document.querySelectorAll('[data-gtab]').forEach(b => b.onclick = () => { gtab = b.dataset.gtab; store('gtab', gtab); renderGame(); });
    document.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { metric = b.dataset.metric; renderGame(); });
    wireMap(g); wireScrub(g);
    seek(curT);
  }
  const loaded = {};
  async function gamePage(meta) {
    if (playing) { clearInterval(playing); playing = null; }
    $('view').innerHTML = '<div class="empty">Chargement de la partie…</div>';
    try {
      const g = loaded[meta.match] || (loaded[meta.match] = await (await fetch('games/' + meta.match + '.json', { cache: 'no-cache' })).json());
      if (G !== g) { view.vb = null; const c = g.ages.me['Castle'] || g.ages.him['Castle']; curT = c ? Math.ceil(c[1] / 1000) : Math.min(600, Math.floor(g.game_ms / 1000)); }
      G = g; renderGame();
    } catch (e) { $('view').innerHTML = '<div class="empty">Partie introuvable (' + esc(e.message) + ').</div>'; }
  }

  const [hm, ht] = location.hash.slice(1).split('--');
  const first = CARDS[0];
  $('mine').value = civs.find(c => slug(c) === hm) || (first && first.card.mine) || civs[0];
  $('theirs').value = civs.find(c => slug(c) === ht) || (first && first.card.theirs) || civs[0];
  $('civ').innerHTML = '<option value="">Toutes les civs</option>' + civNames.map(c => '<option>' + esc(c) + '</option>').join('');
  function route() {
    const civTab = !!STATS && location.hash.startsWith('#civ'), gameTab = location.hash.startsWith('#game');
    $('tabM').className = civTab || gameTab ? '' : 'on'; $('tabC').className = civTab ? 'on' : ''; $('tabG').className = gameTab ? 'on' : '';
    $('ctlM').hidden = civTab || gameTab; $('ctlC').hidden = !civTab; $('tabC').hidden = !STATS; $('tabG').hidden = !GAMES.length;
    if (gameTab) {
      const g = GAMES.find(x => '#game/' + x.match === location.hash);
      if (g) gamePage(g); else gamesList();
      return;
    }
    if (!civTab) {
      if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
      return;
    }
    const c = civNames.find(n => '#civ/' + slug(n) === location.hash);
    $('civ').value = c || '';
    if (c) civPage(c); else overview();
  }
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  $('civ').onchange = () => { location.hash = $('civ').value ? 'civ/' + slug($('civ').value) : 'civ'; };
  $('tabM').onclick = () => { history.replaceState(null, '', '#'); route(); };
  $('tabC').onclick = () => { location.hash = 'civ'; };
  $('tabG').onclick = () => { location.hash = 'games'; };
  window.addEventListener('hashchange', route);
  route();

  // Partie en cours (S91) : toutes les 10 s, l'API publique d'aoe2companion (CORS ouvert) dit si
  // un des comptes du joueur est en 1v1. Si oui : bandeau, puis la fiche du matchup, sinon la page
  // de la civ adverse, une seule fois par partie pour ne pas reprendre la main au joueur.
  let shownMatch = null, testUntil = 0;
  const clock = () => new Date().toLocaleTimeString('fr-FR');
  // Affiche une partie en cours : bandeau, puis le matchup (fiche rédigée ou vue auto), une fois par partie.
  let banner = null; // 'live' | 'test' | 'last' : la détection n'efface que son propre bandeau
  const mins = m => m.finished ? Math.round((Date.parse(m.finished) - Date.parse(m.started)) / 60000) + ' min' : '';
  function showMatch(m, kind) {
    const test = kind === 'test', last = kind === 'last';
    const players = m ? m.teams.flatMap(t => t.players) : [];
    const me = players.find(p => ME.includes(p.profileId)), him = players.find(p => !ME.includes(p.profileId));
    if (!m || players.length !== 2 || !me || !him) {
      if (banner !== 'last') { $('live').hidden = true; banner = null; }
      return false;
    }
    banner = kind; $('live').hidden = false;
    $('live').innerHTML = (test ? '🧪 <b>TEST</b> · ' : '')
      + (last ? '⏮ <b>Dernière partie</b> (' + esc(me.name) + ') : ' + (me.won ? '✅ gagnée' : me.won === false ? '❌ perdue' : '?') + ' · ' : '🔴 <b>En partie</b> : ')
      + esc(me.civName || '?') + ' contre ' + esc(him.civName || '?')
      + ' — ' + esc(him.name) + (him.rating ? ' (' + him.rating + ')' : '') + ' · ' + esc(m.mapName || '')
      + (last ? ' · ' + mins(m) + (me.ratingDiff ? ' · ' + (me.ratingDiff > 0 ? '+' : '') + me.ratingDiff + ' Elo' : '')
        + ' · <a href="https://www.aoe2insights.com/match/' + m.matchId + '/" target="_blank" rel="noopener">replay sur AoE2 Insights</a>'
        + ' · <a href="#" id="closeLast">✕</a>' : '');
    if (last) $('closeLast').onclick = e => { e.preventDefault(); $('live').hidden = true; banner = null; };
    if (shownMatch === m.matchId) return true;
    shownMatch = m.matchId;
    if (civs.includes(me.civName) && civs.includes(him.civName)) {
      $('mine').value = me.civName; $('theirs').value = him.civName; history.replaceState(null, '', '#'); route();
    }
    return true;
  }
  async function live() {
    if (document.hidden || !ME.length || Date.now() < testUntil) return;
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=3&profile_ids=' + ME.join(','));
      if (!r.ok) { $('liveStatus').textContent = clock() + ' · API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => !x.finished && Date.now() - Date.parse(x.started) < 3 * 3600e3);
      $('liveStatus').textContent = clock() + ' · ' + (showMatch(m, 'live') ? 'en partie' : 'pas en partie');
    } catch (e) { $('liveStatus').textContent = clock() + ' · réseau indisponible'; }
  }
  // 🧪 : une fausse partie (ta civ = « Ma civ », adversaire au hasard) passe par le même chemin
  // qu'une vraie ; la détection reprend 60 s plus tard.
  $('test').onclick = () => {
    const pick = () => civs[Math.floor(Math.random() * civs.length)];
    const mine = civs.includes($('mine').value) ? $('mine').value : pick();
    let theirs = pick(); while (theirs === mine && civs.length > 1) theirs = pick();
    testUntil = Date.now() + 60000;
    showMatch({ matchId: 'test-' + Date.now(), mapName: 'Arabia', teams: [
      { players: [{ profileId: ME[0], name: 'MoP', civName: mine }] },
      { players: [{ profileId: -1, name: 'Adversaire test', civName: theirs, rating: 1900 }] }] }, 'test');
    $('liveStatus').textContent = 'test : détection en pause 60 s';
  };
  // ⏮ : la dernière partie terminée du compte choisi (ou de tous), même bandeau et même matchup.
  try { $('acct').value = localStorage.getItem('acct') || ''; } catch (e) {}
  $('acct').onchange = () => { try { localStorage.setItem('acct', $('acct').value); } catch (e) {} };
  $('last').onclick = async () => {
    const ids = $('acct').value ? [$('acct').value] : ME;
    $('liveStatus').textContent = 'recherche de la dernière partie…';
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=10&profile_ids=' + ids.join(','));
      if (!r.ok) { $('liveStatus').textContent = 'API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => x.finished && x.teams.flatMap(t => t.players).length === 2);
      shownMatch = null;
      if (!m) { $('liveStatus').textContent = 'aucune partie 1v1 récente'; return; }
      showMatch(m, 'last');
      $('liveStatus').textContent = new Date(m.finished).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    } catch (e) { $('liveStatus').textContent = 'réseau indisponible'; }
  };
  live();
  setInterval(live, 10000);
  document.addEventListener('visibilitychange', live);
})();
</script>
</html>
