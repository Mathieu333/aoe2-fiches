er qui survit compte.","sources":["S89","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":87,"age":2},{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2}]}],"ifSee":[{"trigger":"un bélier (atelier de siège dès son Féodal) qui avance vers ton TC","action":"8-10 vils + tes lanciers frappent le bélier ; tes scouts tuent son escorte. Pas d'archers dessus.","why":"Le Battering Ram a 180 d'armure perce et -3 d'armure mêlée : flèches inutiles, vils et lanciers le cassent.","sources":["tree:Cumans","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Unit","id":448,"age":2}]},{"trigger":"une masse de scouts (ses écuries coûtent 75 bois de moins)","action":"3-4 lanciers sous ton TC, mur complet sans trou ; tes scouts rentrent avec les lanciers, archers derrière le mur.","why":"Il en produit plus que toi et plus vite : tes scouts seuls perdent. Les lanciers + le TC gagnent le combat chez toi (AF6).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":93,"age":2},{"civ":"Chinese","kind":"Building","id":72,"age":1},{"civ":"Chinese","kind":"Unit","id":4,"age":2}]},{"trigger":"ses archers","action":"Range jamais idle, Fletching tout de suite ; tes scouts chassent ses archers isolés. Au clic Castle : Crossbow + Bodkin en premier.","why":"Le premier au Crossbow + Bodkin gagne la guerre d'archers (AF4) ; tes techs coûtent -10 % en Castle.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":4,"age":2},{"civ":"Chinese","kind":"Tech","id":199,"age":2},{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3}]},{"trigger":"ses tirailleurs devant tes archers","action":"Tes scouts sur ses tirailleurs, tes archers derrière le mur. Pas de tirailleurs contre tirailleurs.","why":"Ses tirailleurs ne cassent pas tes murs ; tes scouts les tuent et tes archers restent en vie pour Castle (SF7, TR3).","sources":["manual","S69"],"assets":[{"civ":"Chinese","kind":"Unit","id":448,"age":2}]}],"watch":[{"action":"Tes scouts n'entrent pas sous son TC garni : 5 vils dedans tuent un scout en quelques tirs.","why":"Le but est de lui coûter des vils et du temps, pas d'échanger tes scouts contre rien.","sources":["manual"],"assets":[]},{"action":"Pas de 2e TC chinois en Féodal : ton boom vient en Castle, derrière ton armée.","why":"Tu n'as pas son bonus ; un TC de Féodal sans armée devant est la cible de ses scouts plus rapides.","sources":["tree:Chinese","tree:Cumans"],"assets":[]}]},{"age":3,"goal":"Tenir sa poussée de Castle (knights, Steppe Lancers, béliers) sans perdre de TC, et boomer à 3 TC. S'il ne te casse pas en Castle, il a perdu le late.","do":[{"action":"Crossbow + Bodkin + Thumb Ring ; 10-15 arbalètes avec 6-8 piquiers devant.","why":"Début Castle des Chinese 1900+ : arbalètes chez 47 % des joueurs (69 % de victoires). Sa compo n°1 est le knight : les piquiers le tiennent, les arbalètes tirent derrière (B2).","sources":["manual","S89","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":24,"age":3},{"civ":"Chinese","kind":"Tech","id":200,"age":3},{"civ":"Chinese","kind":"Tech","id":437,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]},{"action":"Pose 2 TC en Castle (3 au total), le 3e une fois tes piquiers sortis.","why":"Chinese 1900+ avec 2 TC posés en Castle : 72 % de victoires (n=68). Chaque TC donne aussi +15 de population.","sources":["S80","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":621,"age":3}]},{"action":"Château dans ta base, au-dessus des fermes. Pierre : 850 (2 TC + château).","why":"Il n'a ni BBC ni trébuchet avant l'Imp : un château chez toi tient ses knights et ses béliers (CA9b).","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Building","id":82,"age":3}]},{"action":"Écurie : 3 knights qui ne servent qu'à tuer ses béliers et ses mangonneaux.","why":"Les flèches ne font rien aux béliers ; les knights tuent le siège et reviennent sous tes arbalètes.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3}]},{"action":"Monastère : 3-4 moines derrière la boule pour soigner et convertir ses knights.","why":"Contre une civ knights, les moines comptent dans le combat (ATK1).","sources":["manual","S41","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Building","id":104,"age":3},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]}],"ifSee":[{"trigger":"une masse de knights","action":"8-10 piquiers devant, arbalètes derrière, combat sous tes TC et ton château. Jamais tes arbalètes seules en terrain ouvert.","why":"Ses knights sont 10 % plus rapides que tes renforts : il gagne seulement si tu te bats loin de chez toi.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Steppe Lancers","action":"Même réponse, avec plus de piquiers ; une fois bloqués, tes arbalètes les fondent (60 PV, 1 d'armure perce).","why":"Le Steppe Lancer est sa meilleure piste en Castle chez les 1900+ (68 % quand ≥ 20 % de l'armée, n=19).","sources":["tree:Cumans","S80","data"],"assets":[{"civ":"Chinese","kind":"Unit","id":358,"age":3},{"civ":"Chinese","kind":"Unit","id":24,"age":3}]},{"trigger":"des Kipchaks ou des cav. archers","action":"Elite Skirmisher : 8-10 tirailleurs avec tes arbalètes, sous tes TC.","why":"Les tirailleurs ne coûtent pas d'or et tiennent ses archers montés ; tes arbalètes restent pour ses knights.","sources":["manual","tree:Chinese"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3}]},{"trigger":"des béliers (Capped Ram dès son Castle) et des mangonneaux","action":"Tes 3 knights sur ses mangonneaux, tes piquiers et des vils sur les béliers ; arbalètes écartées en ligne.","why":"Ses mangonneaux tuent une boule d'arbalètes groupée ; ses béliers ne craignent que la mêlée.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":38,"age":3},{"civ":"Chinese","kind":"Unit","id":358,"age":3}]}],"watch":[{"action":"Pas de push forward en Castle : tu gagnes en attendant.","why":"En terrain ouvert ses montés plus rapides contournent tes piquiers ; chez toi, TC + château + piquiers les arrêtent.","sources":["manual","S47"],"assets":[]},{"action":"Garde 4-5 piquiers près de tes fermes : il a la cav la plus rapide de la partie.","why":"Montés Cumans +10 % en Castle : un raid sur fermes nues coûte plus que la bataille.","sources":["tree:Cumans"],"assets":[]}]},{"age":4,"goal":"Passer Imp sans perdre de TC, puis prendre la carte : Arbalest + Bracer et scorpions contre une civ sans Arbalest, sans Bracer, sans BBC.","do":[{"action":"Arbalester + Bracer dès le clic, puis Chemistry.","why":"Ses archers à pied s'arrêtent au Crossbow sans Bracer : ton tir à distance devient nettement meilleur (techs -15 % en Imp).","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":492,"age":4},{"civ":"Chinese","kind":"Tech","id":201,"age":4},{"civ":"Chinese","kind":"Tech","id":47,"age":4}]},{"action":"Halberdier : 10-15 hallebardiers devant la boule.","why":"Paladin, Hussar et Steppe Lancer : toute sa fin de partie est montée.","sources":["tree:Cumans","manual"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"action":"Heavy Scorpion + Rocketry + Ballistics : 6-10 scorpions derrière les halbs.","why":"Contre une civ sans BBC, des scorpions protégés sont un plan (LATE1) ; Rocketry leur donne +25 % d'attaque.","sources":["manual","S43","tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":542,"age":4},{"civ":"Chinese","kind":"Tech","id":52,"age":4},{"civ":"Chinese","kind":"Tech","id":93,"age":3},{"civ":"Chinese","kind":"Building","id":49,"age":3}]},{"action":"2-3 trébuchets dans l'armée pour ses châteaux.","why":"Sans BBC, il ne peut tuer tes trébuchets qu'en chargeant à travers tes halbs.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":331,"age":4}]}],"ifSee":[{"trigger":"des Paladins","action":"Halbs devant, moines derrière, scorpions en arrière ; ne charge pas, laisse-le venir sous tes tirs.","why":"Le Paladin perd contre les halbs ; il ne gagne que contre une boule surprise en marche.","sources":["manual","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4},{"civ":"Chinese","kind":"Unit","id":125,"age":3}]},{"trigger":"des Hussars sur tes fermes","action":"6 halbs par groupe de fermes + vils dans les TC ; ta boule principale ne rentre pas.","why":"Ses raids servent à faire reculer ta boule ; ta Light Cav n'a pas Hussar et perd la poursuite.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":359,"age":4}]},{"trigger":"des Siege Onagers ou des Onagers sur ta boule","action":"3-4 Cavaliers sur ses onagres, arbalètes et scorpions écartés.","why":"L'onagre est sa seule réponse à ta masse à distance ; tes Cavaliers le tuent avant le 2e tir.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":283,"age":4}]},{"trigger":"des Kipchaks ou des Heavy Cavalry Archers","action":"Elite Skirmishers + Arbalests ; tes scorpions restent pour ses knights.","why":"Tes tirailleurs Elite + Arbalests avec Bracer battent ses archers montés.","sources":["tree:Chinese","tree:Cumans"],"assets":[{"civ":"Chinese","kind":"Unit","id":6,"age":3},{"civ":"Chinese","kind":"Unit","id":492,"age":4}]}],"watch":[{"action":"Pas de Light Cav en masse : sans Hussar, elle perd contre ses Hussars.","why":"Arbre chinois : Light Cavalry seulement ; la sienne monte au Hussar.","sources":["tree:Chinese","tree:Cumans"],"assets":[]},{"action":"Si ton push échoue, pas de deuxième push en petits groupes : tiens chez toi, il n'a rien contre ton siège protégé.","why":"Le temps joue pour toi : il n'a ni Arbalest, ni Bracer, ni BBC.","sources":["manual","tree:Cumans"],"assets":[]}]}],"un     if (gameTab) {
      const g = GAMES.find(x => '#game/' + x.match === location.hash);
      if (g) gamePage(g); else gamesList();
      return;
    }
    if (!civTab) {
      // Lien interne #mine--theirs (ex. « fiche du matchup » d'une partie) : les menus suivent le lien.
      const [hm2, ht2] = location.hash.slice(1).split('--'), m2 = civs.find(c => slug(c) === hm2), t2 = civs.find(c => slug(c) === ht2);
      if (m2 && t2) { $('mine').value = m2; $('theirs').value = t2; }
      if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
      return;
    }
    const c = civNames.find(n => '#civ/' + slug(n) === location.hash);
    $('civ').value = c || '';
    if (c) civPage(c); else overview();
  }
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  $('civ').onchange = () => { location.hash = $('civ').value ? 'civ/' + slug($('civ').value) : 'civ'; };
  $('tabM').onclick = () => { history.replaceState(null, '', '#'); route(); };
  $('tabC').onclick = () => { location.hash = 'civ'; };
  $('tabG').onclick = () => { location.hash = 'games'; };
  window.addEventListener('hashchange', route);
  route();

  // Partie en cours (S91) : toutes les 10 s, l'API publique d'aoe2companion (CORS ouvert) dit si
  // un des comptes du joueur est en 1v1. Si oui : bandeau, puis la fiche du matchup, sinon la page
  // de la civ adverse, une seule fois par partie pour ne pas reprendre la main au joueur.
  let shownMatch = null, testUntil = 0;
  const clock = () => new Date().toLocaleTimeString('fr-FR');
  // Affiche une partie en cours : bandeau, puis le matchup (fiche rédigée ou vue auto), une fois par partie.
  let banner = null; // 'live' | 'test' | 'last' : la détection n'efface que son propre bandeau
  const mins = m => m.finished ? Math.round((Date.parse(m.finished) - Date.parse(m.started)) / 60000) + ' min' : '';
  function showMatch(m, kind) {
    const test = kind === 'test', last = kind === 'last';
    const players = m ? m.teams.flatMap(t => t.players) : [];
    const me = players.find(p => ME.includes(p.profileId)), him = players.find(p => !ME.includes(p.profileId));
    if (!m || players.length !== 2 || !me || !him) {
      if (banner !== 'last') { $('live').hidden = true; banner = null; }
      return false;
    }
    banner = kind; $('live').hidden = false;
    $('live').innerHTML = (test ? '🧪 <b>TEST</b> · ' : '')
      + (last ? '⏮ <b>Dernière partie</b> (' + esc(me.name) + ') : ' + (me.won ? '✅ gagnée' : me.won === false ? '❌ perdue' : '?') + ' · ' : '🔴 <b>En partie</b> : ')
      + esc(me.civName || '?') + ' contre ' + esc(him.civName || '?')
      + ' — ' + esc(him.name) + (him.rating ? ' (' + him.rating + ')' : '') + ' · ' + esc(m.mapName || '')
      + (last ? ' · ' + mins(m) + (me.ratingDiff ? ' · ' + (me.ratingDiff > 0 ? '+' : '') + me.ratingDiff + ' Elo' : '')
        + ' · <a href="https://www.aoe2insights.com/match/' + m.matchId + '/" target="_blank" rel="noopener">replay sur AoE2 Insights</a>'
        + ' · <a href="#" id="closeLast">✕</a>' : '');
    if (last) $('closeLast').onclick = e => { e.preventDefault(); $('live').hidden = true; banner = null; };
    if (shownMatch === m.matchId) return true;
    shownMatch = m.matchId;
    if (civs.includes(me.civName) && civs.includes(him.civName)) {
      $('mine').value = me.civName; $('theirs').value = him.civName; history.replaceState(null, '', '#'); route();
    }
    return true;
  }
  async function live() {
    if (document.hidden || !ME.length || Date.now() < testUntil) return;
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=3&profile_ids=' + ME.join(','));
      if (!r.ok) { $('liveStatus').textContent = clock() + ' · API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => !x.finished && Date.now() - Date.parse(x.started) < 3 * 3600e3);
      $('liveStatus').textContent = clock() + ' · ' + (showMatch(m, 'live') ? 'en partie' : 'pas en partie');
    } catch (e) { $('liveStatus').textContent = clock() + ' · réseau indisponible'; }
  }
  // 🧪 : une fausse partie (ta civ = « Ma civ », adversaire au hasard) passe par le même chemin
  // qu'une vraie ; la détection reprend 60 s plus tard.
  $('test').onclick = () => {
    const pick = () => civs[Math.floor(Math.random() * civs.length)];
    const mine = civs.includes($('mine').value) ? $('mine').value : pick();
    let theirs = pick(); while (theirs === mine && civs.length > 1) theirs = pick();
    testUntil = Date.now() + 60000;
    showMatch({ matchId: 'test-' + Date.now(), mapName: 'Arabia', teams: [
      { players: [{ profileId: ME[0], name: 'MoP', civName: mine }] },
      { players: [{ profileId: -1, name: 'Adversaire test', civName: theirs, rating: 1900 }] }] }, 'test');
    $('liveStatus').textContent = 'test : détection en pause 60 s';
  };
  // ⏮ : la dernière partie terminée du compte choisi (ou de tous), même bandeau et même matchup.
  try { $('acct').value = localStorage.getItem('acct') || ''; } catch (e) {}
  $('acct').onchange = () => { try { localStorage.setItem('acct', $('acct').value); } catch (e) {} };
  $('last').onclick = async () => {
    const ids = $('acct').value ? [$('acct').value] : ME;
    $('liveStatus').textContent = 'recherche de la dernière partie…';
    try {
      const r = await fetch('https://data.aoe2companion.com/api/matches?per_page=10&profile_ids=' + ids.join(','));
      if (!r.ok) { $('liveStatus').textContent = 'API indisponible (' + r.status + ')'; return; }
      const m = (await r.json()).matches.find(x => x.finished && x.teams.flatMap(t => t.players).length === 2);
      shownMatch = null;
      if (!m) { $('liveStatus').textContent = 'aucune partie 1v1 récente'; return; }
      showMatch(m, 'last');
      $('liveStatus').textContent = new Date(m.finished).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    } catch (e) { $('liveStatus').textContent = 'réseau indisponible'; }
  };
  live();
  setInterval(live, 10000);
  document.addEventListener('visibilitychange', live);
})();
</script>
</html>
