    $('view').innerHTML = '<p class="note">' + CAVEAT + '</p><table><tr><th>Civ</th><th>Win rate</th><th>Ouverture la plus jouée</th><th>Clic Castle</th><th>Piste la plus nette</th></tr>'
      + rows.map(([c, d]) => '<tr><td><a href="#civ/' + slug(c) + '">' + esc(c) + '</a></td><td>' + wr(d.all) + '</td><td>'
        + (d.openings[0] ? esc(d.openings[0][0]) + ' ' + Math.round(100 * d.openings[0][1][1] / d.all[1]) + ' %, win ' + pct(d.openings[0][1]) + ' %' : '-')
        + '</td><td>' + esc(d.clicks[1]) + '</td><td>' + (d.leads[0] ? esc(d.leads[0][0]) + ' : ' + wr(d.leads[0][1]) + ' contre ' + wr(d.leads[0][2]) : '-') + '</td></tr>').join('') + '</table>';
  }
  function civPage(c) {
    const d = STATS.civs[c];
    const li = (label, t, extra) => '<li><b>' + esc(label) + '</b> — ' + wr(t) + (extra || '') + '</li>';
    const cmp = (y, n) => ' contre ' + wr(n) + ' <span class="' + (pct(y) > pct(n) ? 'up">▲' : 'dn">▼') + '</span>';
    $('view').innerHTML = '<div class="ttl"><b>' + esc(c) + '</b> ' + wr(d.all) + '</div>'
      + '<p class="their">Clics médians : Féodal ' + esc(d.clicks[0]) + ' · Castle ' + esc(d.clicks[1]) + ' · Impérial ' + esc(d.clicks[2]) + '</p>'
      + '<h4>Pistes (écart à 95 %, groupes ≥ 10)</h4>'
      + (d.leads.length ? d.leads.map(l => '<div class="lead">' + esc(l[0]) + ' : ' + wr(l[1]) + cmp(l[1], l[2]) + '</div>').join('')
        : '<p class="note">Aucune : l\'échantillon ne permet pas de conclure.</p>')
      + '<div class="cols st">'
      + '<section class="a2"><div class="age-hd"><div class="an">OUVERTURE</div><div class="goal">4 premières unités militaires ; M@A = milices avant le Féodal</div></div><ul>'
        + d.openings.map(o => li(o[0], o[1], ' · ' + Math.round(100 * o[1][1] / d.all[1]) + ' % des parties · Castle ' + esc(o[2]))).join('') + '</ul></section>'
      + '<section class="a3"><div class="age-hd"><div class="an">CASTLE</div><div class="goal">Armée du clic Castle au clic Impérial (' + d.castleN + ' joueurs)</div></div>'
        + '<h4>Compositions (unités ≥ 20 %)</h4><ul>' + d.castle.map(m => li(m[0], m[1])).join('') + '</ul>'
        + '<h4>Unité par unité : ≥ 20 % de l\'armée, ou non</h4><ul>' + d.units.map(u => li(u[0], u[1], cmp(u[1], u[2]))).join('') + '</ul></section>'
      + '<section class="a4"><div class="age-hd"><div class="an">IMPÉRIAL</div><div class="goal">Armée après le clic (' + d.impN + ' joueurs) · clic : gagnants '
        + esc(d.impClick[0]) + ', perdants ' + esc(d.impClick[1]) + '</div></div><ul>' + d.imperial.map(m => li(m[0], m[1])).join('') + '</ul></section></div>'
      + '<h4>Techs prises en Castle</h4><table><tr><th>Tech</th><th>Joueurs</th><th>Gagnants</th><th>Perdants</th></tr>'
        + d.techs.map(t => '<tr><td>' + esc(t[0]) + '</td><td>' + t[1] + ' %</td><td>' + t[2] + ' %</td><td>' + t[3] + ' %</td></tr>').join('') + '</table>'
      + '<p class="note">' + CAVEAT + '</p>';
  }

  const [hm, ht] = location.hash.slice(1).split('--');
  const first = CARDS[0];
  $('mine').value = civs.find(c => slug(c) === hm) || (first && first.card.mine) || civs[0];
  $('theirs').value = civs.find(c => slug(c) === ht) || (first && first.card.theirs) || civs[0];
  $('civ').innerHTML = '<option value="">Toutes les civs</option>' + civNames.map(c => '<option>' + esc(c) + '</option>').join('');
  function route() {
    const civTab = !!STATS && location.hash.startsWith('#civ');
    $('tabM').className = civTab ? '' : 'on'; $('tabC').className = civTab ? 'on' : '';
    $('ctlM').hidden = civTab; $('ctlC').hidden = !civTab; $('tabC').hidden = !STATS;
    if (!civTab) {
      if (civs.length) show(); else $('view').innerHTML = '<div class="empty">Aucune fiche publiée pour l\'instant.</div>';
      return;
    }
    const c = civNames.find(n => '#civ/' + slug(n) === location.hash);
    $('civ').value = c || '';
    if (c) civPage(c); else overview();
  }
  $('mine').onchange = $('theirs').onchange = show;
  $('swap').onclick = () => { const m = $('mine').value; $('mine').value = $('theirs').value; $('theirs').value = m; show(); };
  $('civ').onchange = () => { location.hash = $('civ').value ? 'civ/' + slug($('civ').value) : 'civ'; };
  $('tabM').onclick = () => { history.replaceState(null, '', '#'); route(); };
  $('tabC').onclick = () => { location.hash = 'civ'; };
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</html>
